l_russian:
 td_title_button:0 "Доминирование"
 td_title_button_tt:0 "Изучить список де-юре правителей перед провозглашением титула и началом войны за доминирование. Указанные золото и престиж списываются при начале похода.\n\nДля этого нужны мирное время и достаточное количество обоих ресурсов. Уже начатая попытка доминирования или неистёкший срок ожидания также блокируют действие.\n\n"
 td_cooldown_available_tt:0 "До новой попытки доминирования: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Доминирование: [td_target.GetName]"
 title_domination.0001.desc:0 "У титула [td_target.GetName] нет владельца. Я могу провозгласить этот титул своим и потребовать признания от правителей его де-юре земель. Они смогут сопротивляться, сохранить нейтралитет или присягнуть мне, если позволяет их ранг.\n\nЦена похода: [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! и [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. Она зависит от ранга титула, его земель и их удалённости от моей державы.\n\nПобеда закрепит титул за мной. Поражение уничтожит его, вернёт независимость примкнувшим ко мне де-юре правителям и обяжет меня выплатить контрибуцию тем, кто сопротивлялся."
 title_domination.0001.begin:0 "Начать расширение."
 title_domination.0001.cancel:0 "Отказаться от расширения."
 title_domination.0002.t:0 "Притязание на господство"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] провозглашает своей державой [td_target.GetName] и требует признания от де-юре правителей. После получения ответов начнётся общая война с теми, кто решит сопротивляться.\n\nЯ могу сопротивляться, сохранить нейтралитет или присягнуть, если позволяет мой ранг. При иной конфессии можно попросить религиозной защиты, если её допускает договор. Военный ответ недоступен, когда мои текущие войны несовместимы со стороной доминанта или уже определившихся участников. Посторонние войны сами по себе не мешают ответить.\n\nПравители отвечают по очереди: следующим становится сильнейший из ещё не ответивших. Переговоры о религиозной защите завершаются до перехода к следующему правителю. Ответы следуют сразу, в течение одного дня; в одиночной игре обычная пауза события удерживает время, пока игрок делает выбор."
 title_domination.0002.fight:0 "Сражаться против доминанта."
 title_domination.0002.ignore:0 "Игнорировать доминанта."
 title_domination.0002.join:0 "Примкнуть к доминанту."
 title_domination.0002.religion:0 "Примкнуть в обмен на религиозную защиту."
 title_domination.0003.t:0 "Просьба о религиозной защите"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], правитель иной конфессии, предлагает признать мою власть над титулом [td_target.GetName], стать моим вассалом и вступить в войну на моей стороне. Взамен вассальный договор должен гарантировать религиозную защиту.\n\nВ случае отказа ему предстоит вновь выбрать между сопротивлением, нейтралитетом и подчинением без этой гарантии."
 title_domination.0003.grant:0 "Предоставить религиозную защиту."
 title_domination.0003.refuse:0 "Отказать в религиозной защите."
 title_domination.0004.t:0 "В религиозной защите отказано"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] отклоняет мою просьбу о религиозной защите. Мне предстоит решить: сражаться, сохранить нейтралитет или присягнуть без этой гарантии."
 title_domination.0004.ok:0 "Придётся сделать новый выбор."
 title_domination.0010.t:0 "Судьба титула [td_target.GetName]"
 title_domination.0010.victory_desc:0 "Борьба за доминирование окончена. Моя власть признана, и титул [td_target.GetName] остаётся за мной."
 title_domination.0010.defeat_desc:0 "Попытка установить господство над титулом [td_target.GetName] провалилась. Провозглашённый титул уничтожен, примкнувшие к этому походу де-юре правители вновь независимы, а тем, кто сопротивлялся, причитается контрибуция."
 title_domination.0010.ok:0 "Борьба окончена."
 td_domination_cb:0 "Доминирование за титул"
 td_domination_war:0 "Война за доминирование"
 td_domination_victory:0 "Господство установлено"
 td_domination_defeat:0 "Доминирование провалилось"
 td_preview_defenders_tt:0 "Де-юре правители, которым будет предъявлено требование:"
 td_start_tt:0 "Оплатить поход и создать титул. Правители отвечают от сильнейшего к слабейшему в тот же день; война начинается после всех ответов. С начала действует ожидание в десять лет: победа, титул без сопротивления или техническая отмена с возвратом затрат снимают его; поражение сохраняет оставшийся срок."
 td_join_tt:0 "Вы становитесь вассалом доминанта и вступаете на его стороне, когда начинается общая война. При его поражении вы вернёте независимость. Этот выбор должен быть совместим со всеми, кто уже определился со стороной."
 td_religion_tt:0 "Попросить религиозной защиты в вассальном договоре. При согласии вы становитесь вассалом доминанта и вступаете в войну на его стороне. При отказе вы выбираете снова, уже без этой опции."
 td_neutral_tt:0 "Вы не вступаете в войну и сохраняете владения и прежнее политическое положение. Доля контрибуции вам не причитается."
 td_fight_tt:0 "Вы присоединитесь к общей войне против доминанта после получения остальных ответов. Если его поход провалится, вы получите долю контрибуции."
 td_victory_tt:0 "Доминант сохраняет провозглашённый титул."
 td_defeat_tt:0 "Провозглашённый титул уничтожается. Примкнувшие к доминанту де-юре правители получают независимость, а контрибуция делится между теми, кто сопротивлялся."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "Коалицию не удалось собрать"
 title_domination.0007.desc:0 "После получения ответов военная обстановка изменилась либо обещанные участники не смогли вступить в одну общую войну. Никто из уже определившихся участников не будет исключён молча. Попытка доминирования за [td_target.GetName] отменена, затраченные золото и престиж полностью возвращены.\n\nВременный титул упразднён, подчинившиеся ради этой кампании правители освобождены. Их прочие войны продолжаются без изменений."
 title_domination.0007.ok:0 "Нужно пересмотреть планы кампании."
 td_oath_current_war_desc:0 "\n\nЯ уже воюю против доминанта в другой войне. Пока она продолжается, нельзя вступить с ним во вторую общую войну или принести вассальную присягу. Нейтралитет в этой кампании оставит прежнюю войну без изменений."
 td_oath_current_war_tt:0 "Нельзя принести вассальную присягу, пока вы уже воюете против доминанта в другой войне. Это решение не завершит прежнюю войну."
 td_fight_military_available_tt:0 "Ответ должен оставаться актуальным. Ваши войны должны позволять выступить против доминанта и всех примкнувших к нему правителей вместе со всеми, кто уже выбрал сопротивление."
 td_join_military_available_tt:0 "Ответ должен оставаться актуальным. Ваши войны должны позволять присоединиться к доминанту и всем примкнувшим к нему правителям против всех, кто уже выбрал сопротивление."
 td_religion_grant_available_tt:0 "Просьба должна оставаться актуальной, а религиозная защита — допустимой. Текущие войны просителя должны позволять ему вступить на вашей стороне в общую войну."
 td_legacy_campaign_title:0 "Прежняя кампания"
 td_legacy_campaign_desc:0 "Прежние правила ожидания и отложенной поддержки больше не используются. Незавершённая попытка по этим правилам отменяется: расходы на подготовку возвращаются, временный титул упраздняется, подчинившиеся ради неё правители освобождаются. Прочие войны продолжаются без изменений."
 td_legacy_campaign_close:0 "Понятно."
 td_oath_rejected_desc:0 "\n\nПрисяга не состоялась. Теперь я могу выбрать сопротивление, если оно доступно, или нейтралитет."

# Forecast snapshot and voluntary diplomatic consequences.
 td_fc_header_tt:0 "#T Прогноз по наиболее вероятным ответам#!"
 td_fc_own_tt:0 "#high Ваша держава:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] сил вашей предполагаемой стороны)."
 td_fc_support_header_tt:0 "#P Ожидаемая поддержка:#! правителей — [SCOPE.ScriptValue('td_fc_support_count_value')|0], [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Ожидаемое сопротивление:#! правителей — [SCOPE.ScriptValue('td_fc_fighters_count_value')|0], [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Ожидаемый нейтралитет:#! правителей — [SCOPE.ScriptValue('td_fc_neutral_count_value')|0], [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Условная поддержка:#! [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] правителей / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] предположительно попросят религиозную защиту. Сценарий предполагает ваше согласие и успешное принятие их присяги."
 td_fc_ratio_tt:0 "#high Предполагаемые силы:#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] на вашей стороне против [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] у сопротивления ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "Соотношение не рассчитывается: в прогнозе у сопротивления [soldier_i] 0 воинов."
 td_fc_caveat_tt:0 "#weak Снимок: по одному ответу с наибольшим весом, не математическое ожидание сторон. Шансы рассчитаны по весам ИИ; игроки и предыдущие ответы могут изменить результат. Численность без внешних союзников и будущего набора — не вероятность победы. Вклад поддержки указан в вашу сторону, остальных — в свою группу.#!"
 td_diplomacy_begin_tt:0 "#warning Договоры нарушаются только при реальной войне.#! За каждого атакованного союзника: разрыв союза, −250 престижа и −1 уровень славы. За каждое исходящее перемирие: −250 престижа, −1 уровень славы и потеря легитимности по рангу. Также на три года действуют модификаторы мнения: −25 за нападение на союзников и −50 за нарушение перемирий, по одному каждого типа. Ресурсные потери суммируются по противникам; перки и особые исключения учитываются. Защита, нейтралитет и отсутствие войны штрафов не вызывают."
 td_diplomacy_join_tt:0 "#warning Вы вступаете на стороне нападения.#! Ваши союзы и исходящие перемирия с защитниками могут вызвать те же потери престижа, славы и, при перемирии, легитимности за каждого противника, а также модификаторы мнения. Религиозная защита от них не освобождает; без войны штрафов нет."
 td_diplomacy_defend_tt:0 "Оборона против доминанта не делает вас нарушителем союза или перемирия. За нарушенные договорённости отвечает нападающая сторона."
 td_fc_support_rest_tt:0 "Ещё [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0] правителей: [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
 td_fc_support_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_1_strength_value')|0]; вклад [SCOPE.ScriptValue('td_fc_support_1_share_value')|%0]; шанс ответа [SCOPE.ScriptValue('td_fc_support_1_probability_value')|%0]."
 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning Защита веры.#!"
