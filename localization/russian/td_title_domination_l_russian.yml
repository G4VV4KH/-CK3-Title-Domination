 td_fc_unavailable_tt:0 "В старом предпросмотре нет прогноза. Закройте его и снова откройте действие в окне титула."
 td_settlement_truce_tt:0 "Одностороннее [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], минимум на #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! дн. Более длительное действующее перемирие сохраняется."
