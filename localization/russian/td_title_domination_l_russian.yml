 td_fc_neutral_rest_tt:0 "Ещё [SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0] правителей: [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]."
 td_fc_neutral_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_1_strength_value')|0]; вклад [SCOPE.ScriptValue('td_fc_neutral_1_share_value')|%0]; шанс ответа [SCOPE.ScriptValue('td_fc_neutral_1_probability_value')|%0]."
