 td_fc_unavailable_tt:0 "В старом предпросмотре нет прогноза. Закройте его и снова откройте действие в окне титула."
 td_settlement_truce_tt:0 "Одностороннее [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], минимум на #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! дн. Более длительное действующее перемирие сохраняется."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Правители под защитой ваших договоров#!"

 td_dp_start_desc:0 "\n\nВаши договоры защищают де-юре правителей ([TopScope.GetValue('td_dp_count')|0]). Они могут сохранить нейтралитет или присягнуть вам, если позволяет их ранг. Ваши договоры будут соблюдены, штрафа к уровню славы за них не будет."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — союз"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — перемирие обязывает вас"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — перемирие обязывает этого правителя"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "От признания к подчинению"
 title_domination.0100.desc:0 "Титул [td_target.GetName] закреплён за мной. Я могу завершить кампанию или потребовать покорности от остальных де-юре правителей, включая прежних нейтралов. Они могут сопротивляться или присягнуть. Те, кого защищает договор, вправе сохранить нейтралитет."
 title_domination.0100.start:0 "Потребовать подчинения остальных правителей."
 title_domination.0100.finish:0 "Завершить кампанию, сохранив титул."
 td_subjugation_cb:0 "Подчинение де-юре земель"
 td_subjugation_war:0 "Война за подчинение де-юре земель"
 td_subjugation_victory:0 "Де-юре земли подчинены"
 td_subjugation_defeat:0 "Попытка подчинения отражена"
 td_subjugation_start_tt:0 "Подготовка уже оплачена. Первыми отвечают сильнейшие. При присяге можно запросить религиозную защиту. Война начнётся только против сопротивляющихся. При победе вы получите вассалов из числа правителей более низкого ранга вместе со всеми их владениями. Если вассализация невозможна, вам перейдут только спорные де-юре земли. При поражении вы сохраните закреплённый титул и добровольных вассалов."
 td_subjugation_finish_tt:0 "Сохранить закреплённый титул и добровольных вассалов, завершив кампанию. У вас появятся односторонние перемирия с сопротивлявшимися в первой войне правителями, которые остаются вне вашей державы; более долгие существующие перемирия сохраняются. Второй войны не будет."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — возможный участник новых переговоров, владеющий де-юре землями вне вашей державы."

 td_subjugation_compatible_tt:0 "Предложение должно оставаться действующим, а доминант — независимым и находиться в мире. Каждый ответ и создаваемые войны проверяются по текущему военному положению с учётом выбранного режима."
 td_subjugation_truce_name:0 "Кампания доминирования завершена"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] закрепляет за собой титул [td_target.GetName] и требует моей покорности. Я могу сопротивляться или присягнуть, если позволяет ранг. Присягу можно обусловить религиозной защитой, если её допускает договор. Союз или перемирие с доминантом или уже присягнувшим правителем позволяет мне остаться в стороне и сохранить земли."
 td_subjugation_fight_tt:0 "Выступить против покорения. При поражении независимый правитель более низкого ранга становится вассалом победителя и сохраняет свои титулы, земли и вассалов, в том числе за пределами спорного титула. Если вассализация невозможна, условия мира затронут только спорные де-юре земли. При поражении доминант сохранит закреплённый титул и добровольных вассалов. Контрибуция в этой войне не выплачивается."
 td_subjugation_join_tt:0 "Вы станете вассалом доминанта и останетесь им даже при его поражении во второй фазе."
 title_domination.0002.unavailable:0 "Невозможно принять участие."
 td_subjugation_response_blocked_tt:0 "Текущее военное положение не оставляет допустимого ответа во второй фазе. Покорение отменяется; закреплённый титул и все добровольные присяги сохраняются. Другие войны не прекращаются принудительно."
 title_domination.0101.t:0 "Покорение не началось"
 title_domination.0101.desc:0 "Военное положение изменилось: покорение не удалось начать. Закреплённый титул и все добровольно подчинившиеся правители остаются под властью доминанта. Кампания завершена без повторной платы за подготовку."
 title_domination.0101.ok:0 "Понятно."
 rule_td_subjugation_war_mode:0 "Title Domination: войны покорения"
 setting_td_subjugation_coalition:0 "Общая коалиция"
 setting_td_subjugation_coalition_desc:0 "Во второй фазе все сопротивляющиеся правители защищаются вместе в одной войне с общим исходом. Первая фаза не меняется."
 setting_td_subjugation_individual:0 "Отдельные войны"
 setting_td_subjugation_individual_desc:0 "Во второй фазе против каждого сопротивляющегося правителя начинается отдельная война со своим исходом. Завершение одной войны не завершает остальные. Первая фаза не меняется."
 td_subjugation_individual_cb:0 "Отдельное де-юре покорение"
 td_subjugation_individual_war:0 "Война за отдельное де-юре покорение — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "Де-юре земли покорены"
 td_subjugation_individual_defeat:0 "Отдельное покорение отражено"
 td_subjugation_mode_coalition_tt:0 "#bold Общая коалиция:#! все сопротивляющиеся правители защищаются вместе в одной войне второй фазы с общим исходом."
 td_subjugation_mode_individual_tt:0 "#bold Отдельные войны:#! против каждого сопротивляющегося правителя начинается своя война второй фазы. Победа или поражение завершает только войну с этим противником; остальные продолжаются. Поражение сохраняет закреплённый титул и всех добровольных вассалов, а перемирие получает только главный защитник этой войны."
