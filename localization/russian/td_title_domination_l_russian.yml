 td_fc_fighters_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_3_strength_value')|0]; вклад [SCOPE.ScriptValue('td_fc_fighters_3_share_value')|%0]; шанс ответа [SCOPE.ScriptValue('td_fc_fighters_3_probability_value')|%0]."
