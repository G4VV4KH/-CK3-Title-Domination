l_russian:
 rule_td_domination_territory:0 "Title Domination: доступные титулы"
 setting_td_territory_all:0 "Все титулы"
 setting_td_territory_all_desc:0 "Можно заявить доминирование над несозданным титулом в любой части карты."
 setting_td_territory_realm:0 "Хотя бы одно графство в вашей державе"
 setting_td_territory_realm_desc:0 "В вашей державе должно быть хотя бы одно де-юре графство выбранного титула. Учитываются и владения ваших вассалов."
 setting_td_territory_capital:0 "Титулы, к которым относится столица"
 setting_td_territory_capital_desc:0 "Графство, в котором расположена столица вашей державы, должно де-юре входить в выбранный титул."
 td_discover_domination_decision:0 "Вы можете заявить доминирование"
 td_discover_domination_desc:0 "Выберите несозданный титул, на кампанию за который у вас хватает средств. В окне титула можно посмотреть стоимость подготовки и условия кампании перед её началом."
 td_discover_domination_tooltip:0 "Посмотреть титулы, доступные для доминирования."
 td_discover_domination_confirm:0 "Открыть титул"
 rule_td_ai_frequency:0 "Title Domination: частота доминирования ИИ"
 setting_td_ai_off:0 "Нет"
 setting_td_ai_off_desc:0 "Правители под управлением ИИ отвечают на требования доминанта, но сами не начинают походы."
 setting_td_ai_rare:0 "Редко"
 setting_td_ai_rare_desc:0 "Каждый год у правителя под управлением ИИ есть небольшой шанс рассмотреть один соседний титул. Для похода ему нужны запас ресурсов и подавляющее военное превосходство."
 setting_td_ai_medium:0 "Средне"
 setting_td_ai_medium_desc:0 "Правители под управлением ИИ могут ежегодно искать цели среди соседних титулов. Они оставляют запас ресурсов и стремятся к превосходству над вероятными противниками."
 setting_td_ai_frequent:0 "Часто"
 setting_td_ai_frequent_desc:0 "Каждый квартал правители под управлением ИИ, выполнившие условия, с вероятностью 25% рассматривают соседние титулы. Они могут потратить весь доступный бюджет и начать поход даже при небольшом перевесе вероятных противников."
