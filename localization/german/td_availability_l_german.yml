l_german:
 rule_td_domination_territory:0 "Titeldominanz: Verfügbare Titel"
 setting_td_territory_all:0 "Alle Titel"
 setting_td_territory_all_desc:0 "Jeder noch nicht geschaffene Titel auf der Karte kann zum Ziel einer Dominanzkampagne werden."
 setting_td_territory_realm:0 "Eine Grafschaft in Eurem Reich"
 setting_td_territory_realm_desc:0 "Euer Reich muss mindestens eine De-jure-Grafschaft des Zieltitels umfassen. Grafschaften Eurer Vasallen zählen ebenfalls."
 setting_td_territory_capital:0 "Titel, zu denen Eure Hauptstadt gehört"
 setting_td_territory_capital_desc:0 "Die Grafschaft Eurer Reichshauptstadt muss de jure zum Zieltitel gehören."
 td_discover_domination_decision:0 "Ihr könnt die Dominanz beanspruchen"
 td_discover_domination_desc:0 "Wählt einen noch nicht geschaffenen Titel, für den Ihr Euch eine Kampagne leisten könnt. Im Titelfenster könnt Ihr die Vorbereitungskosten und die Bedingungen prüfen, bevor Ihr Euch entscheidet."
 td_discover_domination_tooltip:0 "Für eine Dominanzkampagne verfügbare Titel anzeigen."
 td_discover_domination_confirm:0 "Titel öffnen"
 rule_td_ai_frequency:0 "Title Domination: Häufigkeit von KI-Feldzügen"
 setting_td_ai_off:0 "Aus"
 setting_td_ai_off_desc:0 "KI-Herrscher können auf Herrschaftsforderungen reagieren, beginnen aber keine eigenen Feldzüge."
 setting_td_ai_rare:0 "Selten"
 setting_td_ai_rare_desc:0 "KI-Herrscher ziehen mit geringer jährlicher Wahrscheinlichkeit einen benachbarten Titel in Betracht. Sie verlangen ausreichende Rücklagen und eine überwältigende militärische Überlegenheit."
 setting_td_ai_medium:0 "Mittel"
 setting_td_ai_medium_desc:0 "KI-Herrscher können jährlich benachbarte Titel prüfen. Sie behalten Rücklagen und streben einen Vorteil gegenüber ihren voraussichtlichen Gegnern an."
 setting_td_ai_frequent:0 "Häufig"
 setting_td_ai_frequent_desc:0 "KI-Herrscher, die die Voraussetzungen erfüllen, prüfen in jedem Quartal mit einer Wahrscheinlichkeit von 25 % benachbarte Titel. Sie können ihre gesamten verfügbaren Mittel einsetzen und einen leichten militärischen Nachteil in Kauf nehmen."
