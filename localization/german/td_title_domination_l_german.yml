 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning Glaubensschutz.#!"
 td_fc_fighters_rest_tt:0 "Weitere [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0] Herrscher: [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; Anteil [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; Antwortchance [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
