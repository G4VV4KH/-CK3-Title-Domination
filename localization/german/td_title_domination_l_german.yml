 td_fc_unavailable_tt:0 "In dieser älteren Vorschau ist keine Prognose verfügbar. Schließt sie und öffnet die Titelaktion erneut für eine neue Momentaufnahme."
 td_settlement_truce_tt:0 "Einseitiger [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], mindestens #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! Tage. Ein bestehender längerer Waffenstillstand bleibt erhalten."
