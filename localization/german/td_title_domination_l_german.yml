 td_fc_neutral_rest_tt:0 "Weitere [SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0] Herrscher: [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]."
