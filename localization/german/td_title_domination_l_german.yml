 td_fc_unavailable_tt:0 "In dieser älteren Vorschau ist keine Prognose verfügbar. Schließt sie und öffnet die Titelaktion erneut für eine neue Momentaufnahme."
 td_settlement_truce_tt:0 "Einseitiger [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], mindestens #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! Tage. Ein bestehender längerer Waffenstillstand bleibt erhalten."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Durch Eure Pakte geschützte Herrscher#!"

 td_dp_start_desc:0 "\n\nEure Pakte schützen [TopScope.GetValue('td_dp_count')|0] De-jure-Herrscher. Sie dürfen neutral bleiben oder den Lehnseid leisten, wenn ihr Rang dies erlaubt. Eure bestehenden Pakte werden ohne Ruhmverlust gewahrt."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — Bündnis"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — Waffenstillstand bindet Euch"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — Waffenstillstand bindet diesen Herrscher"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "Von Anerkennung zu Unterwerfung"
 title_domination.0100.desc:0 "Der Titel [td_target.GetName] ist mir sicher. Ich kann den Feldzug beenden oder von den übrigen De-jure-Herrschern die Unterwerfung fordern, auch von jenen, die bisher neutral waren. Sie können Widerstand leisten oder den Lehnseid schwören. Ein Pakt erlaubt ihnen, neutral zu bleiben."
 title_domination.0100.start:0 "Die Unterwerfung der übrigen Herrscher verlangen."
 title_domination.0100.finish:0 "Den Feldzug mit gesichertem Titel beenden."
 td_subjugation_cb:0 "De-jure-Unterwerfung"
 td_subjugation_war:0 "Krieg zur De-jure-Unterwerfung"
 td_subjugation_victory:0 "De-jure-Gebiete unterworfen"
 td_subjugation_defeat:0 "Unterwerfung abgewehrt"
 td_subjugation_start_tt:0 "Die Vorbereitungen sind bereits bezahlt. Die stärksten Herrscher antworten zuerst. Wer den Lehnseid leistet, kann um Religionsschutz bitten. Nur wer Widerstand leistet, zieht in den Krieg. Bei einem Sieg werden dazu berechtigte Herrscher niedrigeren Ranges mit all ihren Besitzungen Eure Vasallen. Andere Verteidiger treten nur die umstrittenen De-jure-Gebiete ab. Bei einer Niederlage behaltet Ihr den gesicherten Titel und Eure freiwilligen Vasallen."
 td_subjugation_finish_tt:0 "Behaltet den gesicherten Titel und freiwillige Vasallen und beendet den Feldzug. Ihr erhaltet einseitige Waffenstillstände mit den Widerstand leistenden Herrschern des ersten Krieges, die weiterhin außerhalb Eures Reiches stehen; längere bestehende Waffenstillstände bleiben erhalten. Es gibt keinen zweiten Krieg."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — möglicher Befragter mit De-jure-Landen außerhalb Eures Reiches."

 td_subjugation_compatible_tt:0 "Dieses Angebot muss noch gelten; der dominierende Herrscher muss unabhängig sein und Frieden haben. Jede Antwort und die entstehenden Kriege werden gemäß dem gewählten Modus anhand der aktuellen Kriegslage geprüft."
 td_subjugation_truce_name:0 "Der Feldzug zur Vorherrschaft ist beendet"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] hat sich den Titel [td_target.GetName] gesichert und verlangt meine Unterwerfung. Ich kann Widerstand leisten oder bei passendem Rang den Lehnseid schwören und gegebenenfalls Religionsschutz verlangen. Ein Pakt mit dem dominierenden Herrscher oder einem bereits beigetretenen Freiwilligen erlaubt es mir, neutral zu bleiben und mein Land zu behalten."
 td_subjugation_fight_tt:0 "Widerstand gegen die Unterwerfung leisten. Bei einer Niederlage wird ein unabhängiger Herrscher niedrigeren Ranges zum Vasallen des Siegers. Er behält seine Titel, Ländereien und Vasallen, auch außerhalb des umstrittenen Titels. Ist eine Vasallisierung unmöglich, betrifft der Frieden nur die umstrittenen De-jure-Gebiete. Scheitert der Angriff, behält der Angreifer den gesicherten Titel und seine freiwilligen Vasallen. In diesem Krieg werden keine Entschädigungen fällig."
 td_subjugation_join_tt:0 "Ihr werdet Vasall und bleibt es auch, wenn der dominierende Herrscher in dieser Phase verliert."
 title_domination.0002.unavailable:0 "Ich kann nicht teilnehmen."
 td_subjugation_response_blocked_tt:0 "Die aktuelle Kriegslage lässt in dieser zweiten Phase keine zulässige Antwort zu. Die Unterwerfung wird abgebrochen; der gesicherte Titel und alle freiwilligen Treueide bleiben bestehen. Kein anderer Krieg wird zwangsweise beendet."
 title_domination.0101.t:0 "Unterwerfung konnte nicht beginnen"
 title_domination.0101.desc:0 "Die Kriegslage hat sich verändert, sodass die Unterwerfung nicht beginnen konnte. Der gesicherte Titel und alle freiwillig unterworfenen Herrscher bleiben unter der Herrschaft des dominierenden Herrschers. Der Feldzug endet ohne weitere Vorbereitungskosten."
 title_domination.0101.ok:0 "Verstanden."
 rule_td_subjugation_war_mode:0 "Title Domination: Unterwerfungskriege"
 setting_td_subjugation_coalition:0 "Gemeinsame Koalition"
