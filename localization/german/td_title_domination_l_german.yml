l_german:
 td_title_button:0 "Vorherrschaft"
 td_title_button_tt:0 "Prüft die De-jure-Herrscher, bevor Ihr diesen Titel ausruft und einen Krieg um die Vorherrschaft beginnt. Das angezeigte Gold und Prestige werden beim Beginn abgezogen.\n\nIhr müsst im Frieden sein und genügend von beiden Ressourcen besitzen. Ein laufender Vorherrschaftsversuch oder eine noch nicht abgelaufene Wartezeit sperrt diese Aktion ebenfalls.\n\n"
 td_cooldown_available_tt:0 "Zeit bis zum nächsten Vorherrschaftsversuch: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Vorherrschaft über [td_target.GetName]"
 title_domination.0001.desc:0 "[td_target.GetName] hat keinen Inhaber. Ich kann den Titel ausrufen und von den Herrschern seiner De-jure-Lande Anerkennung verlangen. Sie können Widerstand leisten, neutral bleiben oder mir die Treue schwören, sofern ihr Rang es erlaubt.\n\nDer Feldzug kostet [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! und [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. Der Preis richtet sich nach dem Rang des Titels, seinen Ländereien und deren Entfernung zu meinem Reich.\n\nEin Sieg sichert den Titel. Eine Niederlage zerstört ihn, befreit die mir gefolgten De-jure-Herrscher und verpflichtet mich zu Reparationen an jene, die Widerstand geleistet haben."
 title_domination.0001.begin:0 "Die Expansion beginnen."
 title_domination.0001.cancel:0 "Die Expansion aufgeben."
 title_domination.0002.t:0 "Ein Anspruch auf Vorherrschaft"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] hat [td_target.GetName] ausgerufen und verlangt Anerkennung von dessen De-jure-Herrschern. Sobald alle Antworten eingegangen sind, beginnt ein gemeinsamer Krieg gegen jene, die Widerstand wählen.\n\nIch kann Widerstand leisten, neutral bleiben oder die Treue schwören, sofern mein Rang es erlaubt. Ein anderer Glaube kann mich zur Bitte um Religionsschutz berechtigen. Eine militärische Antwort ist gesperrt, wenn meine laufenden Kriege mit dem vorherrschenden Herrscher oder bereits festgelegten Teilnehmern unvereinbar sind. Unbeteiligte Kriege verhindern keine Antwort.\n\nDie Herrscher antworten nacheinander, jeweils die stärkste verbleibende Armee zuerst. Religiöse Verhandlungen enden, bevor der nächste Herrscher angesprochen wird. Die Antworten folgen unmittelbar am selben Tag; im Einzelspieler hält die übliche Ereignispause die Zeit während einer Spielerentscheidung an."
 title_domination.0002.fight:0 "Ich werde den vorherrschenden Herrscher bekämpfen."
 title_domination.0002.ignore:0 "Dieser Kampf ist nicht der meine."
 title_domination.0002.join:0 "Ich schwöre die Treue und ziehe in den Krieg."
 title_domination.0002.religion:0 "Schützt meinen Glauben, dann schwöre ich die Treue."
 title_domination.0003.t:0 "Eine Bitte um Religionsschutz"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], ein Herrscher anderen Glaubens, bietet an, meine Herrschaft über [td_target.GetName] anzuerkennen, mein Vasall zu werden und sich meinem Krieg anzuschließen. Im Gegenzug muss der Vasallenvertrag Religionsschutz garantieren.\n\nLehne ich ab, muss dieser Herrscher erneut zwischen Widerstand, Neutralität und Unterwerfung ohne diesen Schutz wählen."
 title_domination.0003.grant:0 "Dieser Glaube wird geschützt."
 title_domination.0003.refuse:0 "Diesen Schutz werde ich nicht gewähren."
 title_domination.0004.t:0 "Religionsschutz verweigert"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] hat meine Bitte um Religionsschutz abgelehnt. Ich muss entscheiden, ob ich kämpfe, neutral bleibe oder ohne diese Garantie die Treue schwöre."
 title_domination.0004.ok:0 "Dann muss ich erneut wählen."
 title_domination.0010.t:0 "Das Schicksal von [td_target.GetName]"
 title_domination.0010.victory_desc:0 "Der Kampf um die Vorherrschaft ist vorbei. Meine Herrschaft über [td_target.GetName] ist gesichert, und der Titel bleibt mein."
 title_domination.0010.defeat_desc:0 "Mein Versuch, [td_target.GetName] zu beherrschen, ist gescheitert. Der ausgerufene Titel wird zerstört, die diesem Feldzug beigetretenen De-jure-Herrscher werden wieder unabhängig, und den Widerstandleistenden stehen Reparationen zu."
 title_domination.0010.ok:0 "Die Angelegenheit ist entschieden."
 td_domination_cb:0 "Vorherrschaft über einen Titel"
 td_domination_war:0 "Krieg um die Titelvorherrschaft"
 td_domination_victory:0 "Vorherrschaft gesichert"
 td_domination_defeat:0 "Vorherrschaft abgewehrt"
 td_preview_defenders_tt:0 "In diesem Feldzug angesprochene De-jure-Herrscher:"
 td_start_tt:0 "Bezahlt die Kosten und ruft den Titel aus. Die Herrscher antworten am selben Tag, die stärksten zuerst; erst danach beginnt der Krieg. Der Beginn löst eine zehnjährige Wartezeit aus: Sieg, ein unangefochtener Titel oder eine erstattete technische Absage heben sie auf; eine Niederlage lässt die Restdauer bestehen."
 td_join_tt:0 "Ihr werdet Vasall des vorherrschenden Herrschers und tretet bei Beginn des gemeinsamen Krieges seiner Seite bei. Verliert er den Feldzug, werdet Ihr wieder unabhängig. Diese Wahl muss mit allen bereits festgelegten Teilnehmern vereinbar sein."
 td_religion_tt:0 "Bittet um Religionsschutz in Eurem Vasallenvertrag. Wird er gewährt, werdet Ihr Vasall und schließt Euch dem vorherrschenden Herrscher an. Bei Ablehnung wählt Ihr erneut, ohne diese Option."
 td_neutral_tt:0 "Ihr bleibt dem Krieg fern und behaltet Eure Ländereien sowie Euren politischen Status. Ihr erhaltet keinen Anteil an Reparationen."
 td_fight_tt:0 "Nach Eingang der übrigen Antworten tretet Ihr dem gemeinsamen Krieg gegen den vorherrschenden Herrscher bei. Scheitert der Feldzug, erhaltet Ihr einen Anteil an den Reparationen."
 td_victory_tt:0 "Der vorherrschende Herrscher behält den ausgerufenen Titel."
 td_defeat_tt:0 "Der ausgerufene Titel wird zerstört. Die beigetretenen De-jure-Herrscher werden wieder unabhängig, und die Reparationen werden unter den Widerstandleistenden aufgeteilt."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "Die Koalition konnte sich nicht formieren"
 title_domination.0007.desc:0 "Die militärische Lage hat sich nach den Antworten geändert, oder die zugesagten Teilnehmer konnten keinem gemeinsamen Krieg beitreten. Kein angenommener Teilnehmer wird stillschweigend ausgeschlossen. Der Vorherrschaftsversuch über [td_target.GetName] wurde abgesagt und die gesamten Gold- und Prestigekosten erstattet.\n\nDer vorläufige Titel wird aufgelöst, und die für diesen Feldzug unterworfenen Herrscher werden freigelassen. Ihre anderen Kriege bleiben unverändert."
 title_domination.0007.ok:0 "Ich muss diesen Feldzug überdenken."
 td_oath_current_war_desc:0 "\n\nIch kämpfe bereits in einem anderen Krieg gegen den vorherrschenden Herrscher. Solange dieser Konflikt andauert, kann ich weder einen zweiten gemeinsamen Krieg mit ihm führen noch ihm die Treue schwören. Neutralität lässt unseren bestehenden Krieg unverändert."
 td_oath_current_war_tt:0 "Ihr könnt dem vorherrschenden Herrscher nicht die Treue schwören, solange Ihr bereits in einem anderen Krieg sein Feind seid. Diese Entscheidung beendet jenen Krieg nicht."
 td_fight_military_available_tt:0 "Diese Antwort muss noch aktuell sein. Eure Kriege müssen es erlauben, gemeinsam mit allen bisherigen Widerstandleistenden gegen den vorherrschenden Herrscher und sämtliche angenommenen Freiwilligen anzutreten."
 td_join_military_available_tt:0 "Diese Antwort muss noch aktuell sein. Eure Kriege müssen es erlauben, dem vorherrschenden Herrscher und sämtlichen angenommenen Freiwilligen gegen alle bisherigen Widerstandleistenden beizutreten."
 td_religion_grant_available_tt:0 "Die Bitte muss noch aktuell sein und die Voraussetzungen für Religionsschutz erfüllen. Die Kriege des bittenden Herrschers müssen weiterhin seinen Beitritt zu Eurer Seite des gemeinsamen Krieges erlauben."
 td_legacy_campaign_title:0 "Ein früherer Feldzug"
 td_legacy_campaign_desc:0 "Die früheren Regeln für Wartephasen und verzögerte Unterstützung gelten nicht mehr. Ein darunter begonnener, unvollendeter Versuch wird abgesagt, seine Vorbereitungskosten erstattet, sein vorläufiger Titel aufgelöst und seine unterworfenen Herrscher freigelassen. Bestehende Kriege bleiben unverändert."
 td_legacy_campaign_close:0 "Verstanden."
 td_oath_rejected_desc:0 "\n\nDer Treueeid konnte nicht zustande kommen. Ich kann nun Widerstand leisten, sofern verfügbar, oder neutral bleiben."
 td_fc_header_tt:0 "#T Prognose anhand der wahrscheinlichsten Antworten#!"
 td_fc_own_tt:0 "#high Euer Reich:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] Eurer voraussichtlichen Seite)."
 td_fc_support_header_tt:0 "#P Erwartete Unterstützung:#! [SCOPE.ScriptValue('td_fc_support_count_value')|0] Herrscher, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Erwarteter Widerstand:#! [SCOPE.ScriptValue('td_fc_fighters_count_value')|0] Herrscher, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Erwartete Neutralität:#! [SCOPE.ScriptValue('td_fc_neutral_count_value')|0] Herrscher, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Bedingte Unterstützung:#! [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] Herrscher / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] werden voraussichtlich Religionsschutz verlangen. Dieses Szenario setzt voraus, dass Ihr ihn gewährt und ihr Treueeid gelingt."
 td_fc_ratio_tt:0 "#high Erwartete Streitkräfte:#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] auf Eurer Seite gegen [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] im Widerstand ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "Kein Kräfteverhältnis berechnet: Der erwartete Widerstand umfasst [soldier_i] 0 Soldaten."
 td_fc_caveat_tt:0 "#weak Momentaufnahme: je Herrscher eine einzelne Antwort mit dem höchsten Gewicht, kein mathematischer Erwartungswert der Seiten. Die Chancen beruhen auf KI-Gewichten; Spieler und frühere Antworten können das Ergebnis ändern. Die aktuelle Truppenstärke enthält weder externe Verbündete noch künftige Rekrutierungen und ist keine Siegchance. Unterstützungsanteile beziehen sich auf Eure gesamte Seite, andere Anteile auf die jeweilige Gruppe.#!"
 td_diplomacy_begin_tt:0 "#warning Nur ein tatsächlicher Krieg bricht Abkommen.#! Je angegriffenem Verbündeten: Bündnisbruch, −250 Prestige und −1 Ruhmstufe. Je von Euch gebrochenem Waffenstillstand: −250 Prestige, −1 Ruhmstufe und rangabhängiger Legitimitätsverlust. Außerdem gelten drei Jahre lang Meinungsmodifikatoren: −25 für Angriffe auf Verbündete und −50 für Waffenstillstandsbrüche, einmal je Typ. Ressourcenverluste summieren sich je Gegner; Vorteile und Sonderausnahmen gelten weiterhin. Verteidiger, Neutrale und Feldzüge ohne Krieg bleiben straffrei."
 td_diplomacy_join_tt:0 "#warning Ihr schließt Euch der angreifenden Seite an.#! Eure Bündnisse und Waffenstillstände gegenüber Verteidigern können dieselben Prestige-, Ruhm- und bei Waffenstillständen Legitimitätsverluste je Gegner sowie Meinungsmodifikatoren verursachen. Religionsschutz befreit nicht davon; ohne Krieg gibt es keine Strafen."
 td_diplomacy_defend_tt:0 "Die Verteidigung gegen den vorherrschenden Herrscher macht Euch nicht zum Bündnis- oder Waffenstillstandsbrecher. Die angreifende Seite trägt die Verantwortung für verletzte Abkommen."
 td_fc_support_rest_tt:0 "Weitere [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0] Herrscher: [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
