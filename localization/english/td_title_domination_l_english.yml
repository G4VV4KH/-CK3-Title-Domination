 td_fc_unavailable_tt:0 "Forecast unavailable in this older preview. Close it and reopen the title action for a new snapshot."
 td_settlement_truce_tt:0 "One-way [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], at least #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! days. A longer existing truce is retained."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Rulers protected by your pacts#!"

 td_dp_start_desc:0 "\n\nYour pacts protect [TopScope.GetValue('td_dp_count')|0] de jure rulers. They may stay neutral or swear fealty if eligible. Your existing pacts are respected without a loss of fame."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — alliance"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — truce binding you"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — truce binding this ruler"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "Beyond Recognition"
 title_domination.0100.desc:0 "I have secured [td_target.GetName]. I can end the campaign here or demand submission from the remaining de jure rulers, including those who stayed neutral before. They may resist or swear fealty. Those protected by a pact may stay neutral."
 title_domination.0100.start:0 "Demand submission from the remaining rulers."
 title_domination.0100.finish:0 "End the campaign with the title secured."
 td_subjugation_cb:0 "De Jure Subjugation"
 td_subjugation_war:0 "War for De Jure Subjugation"
 td_subjugation_victory:0 "De Jure Lands Subjugated"
 td_subjugation_defeat:0 "Subjugation Repelled"
 td_subjugation_start_tt:0 "Preparation is already paid. The strongest rulers answer first. Those who swear fealty may ask for religious protection. Only resisters face war. Victory makes eligible lower-ranking rulers your vassals with all their lands. Other defenders yield only disputed de jure lands. Defeat leaves you the secured title and your voluntary vassals."
 td_subjugation_finish_tt:0 "Keep the secured title and voluntary vassals, then end the campaign. You receive one-way truces with the first war’s resisting rulers who remain outside your realm; longer existing truces are retained. There is no second war."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — potential respondent holding de jure lands outside your realm."

 td_subjugation_compatible_tt:0 "This offer must still be current, and the dominant ruler must be independent and at peace. Each response and the wars to be formed are checked against the current military situation under the selected war mode."
 td_subjugation_truce_name:0 "The domination campaign has ended"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] has secured [td_target.GetName] and now demands my submission. I may resist, swear fealty if my rank allows it, or seek religious protection if eligible. A pact with the dominant ruler or an earlier volunteer allows me to remain neutral and keep my lands."
 td_subjugation_fight_tt:0 "Take up arms against subjugation. If defeated, an independent ruler of lower rank becomes the victor’s vassal and keeps their titles, lands and vassals, including those outside the disputed title. If vassalage is impossible, the settlement covers only disputed de jure lands. If the attack fails, the dominant ruler keeps the secured title and voluntary vassals. No reparations are due in this war."
 td_subjugation_join_tt:0 "You become a vassal and remain one even if the dominant ruler loses this phase."
 title_domination.0002.unavailable:0 "I cannot take part."
 td_subjugation_response_blocked_tt:0 "The current military situation leaves no legal response in this second phase. Subjugation is cancelled; the secured title and all voluntary vassalage are preserved. No other war is forcibly ended."
 title_domination.0101.t:0 "Subjugation Could Not Begin"
 title_domination.0101.desc:0 "The military situation changed, so subjugation could not begin. The secured title and every ruler who voluntarily submitted remain under the dominant ruler’s authority. The campaign has ended without another preparation payment."
 title_domination.0101.ok:0 "Understood."
 rule_td_subjugation_war_mode:0 "Title Domination: Subjugation Wars"
 setting_td_subjugation_coalition:0 "Common Coalition"
 setting_td_subjugation_coalition_desc:0 "In the second phase, all resisting rulers defend together in one war with a shared outcome. The first phase is unchanged."
 setting_td_subjugation_individual:0 "Individual Wars"
 setting_td_subjugation_individual_desc:0 "In the second phase, each resisting ruler faces a separate war with its own outcome. Ending one war does not end the others. The first phase is unchanged."
 td_subjugation_individual_cb:0 "Individual De Jure Subjugation"
 td_subjugation_individual_war:0 "War for Individual De Jure Subjugation — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "De Jure Lands Subjugated"
 td_subjugation_individual_defeat:0 "Individual Subjugation Repelled"
 td_subjugation_mode_coalition_tt:0 "#bold Common coalition:#! all resisting rulers defend in one second-phase war with a shared outcome."
 td_subjugation_mode_individual_tt:0 "#bold Individual wars:#! each resisting ruler faces a separate second-phase war. Victory or defeat settles that opponent’s war only; other wars continue. Defeat preserves the secured title and all voluntary vassals, and grants a truce only to that war’s main defender."
