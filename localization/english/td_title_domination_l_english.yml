 td_fc_support_row_3_conditional_tt:0 "$td_fc_support_row_3_tt$ #warning Faith protection.#!"
 td_fc_support_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_4_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_support_4_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_support_4_probability_value')|%0]."
 td_fc_support_row_4_conditional_tt:0 "$td_fc_support_row_4_tt$ #warning Faith protection.#!"
 td_fc_support_row_5_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_5.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_5_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_support_5_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_support_5_probability_value')|%0]."
 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning Faith protection.#!"
 td_fc_fighters_rest_tt:0 "Further [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0] rulers: [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
 td_fc_fighters_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_2_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_fighters_2_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_fighters_2_probability_value')|%0]."
 td_fc_fighters_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_3_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_fighters_3_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_fighters_3_probability_value')|%0]."
 td_fc_fighters_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_4_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_fighters_4_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_fighters_4_probability_value')|%0]."
