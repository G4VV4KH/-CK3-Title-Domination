l_english:
 td_title_button:0 "Domination"
 td_title_button_tt:0 "Review the de jure rulers before proclaiming this title and beginning a war for domination. The displayed gold and prestige are charged when you begin.\n\nYou must be at peace and have enough of both resources. An existing domination attempt or an unexpired cooldown also blocks this action.\n\n"
 td_cooldown_available_tt:0 "Time until another domination attempt: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Domination over [td_target.GetName]"
 title_domination.0001.desc:0 "[td_target.GetName] has no holder. I can proclaim the title and demand recognition from the rulers of its de jure lands. They may resist, remain neutral, or swear fealty if their rank permits it.\n\nThe campaign costs [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! and [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. The price reflects the title's rank, its lands, and their distance from my realm.\n\nVictory secures the title. Defeat destroys it, frees the de jure rulers who joined me, and requires reparations to those who resisted."
 title_domination.0001.begin:0 "Begin the expansion."
 title_domination.0001.cancel:0 "Abandon the expansion."
 title_domination.0002.t:0 "A Claim to Domination"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] has proclaimed [td_target.GetName] and demands recognition from its de jure rulers. Once the replies arrive, one war will begin against those who choose to resist.\n\nI may resist, remain neutral, or swear fealty if my rank permits it. A different faith may qualify me to request religious protection. A military choice is unavailable when my current wars conflict with the dominant ruler or anyone who has already chosen a side. Unrelated wars do not prevent a response.\n\nRulers answer one at a time, the strongest remaining army first. Religious negotiations finish before the next ruler is approached. The responses follow immediately within the same day; in single player, the usual event pause holds time while a player chooses."
 title_domination.0002.fight:0 "I will fight the dominant ruler."
 title_domination.0002.ignore:0 "This struggle is not mine."
 title_domination.0002.join:0 "I will swear fealty and join the war."
 title_domination.0002.religion:0 "Protect my faith, and I will swear fealty."
 title_domination.0003.t:0 "A Request for Religious Protection"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], a ruler of a different faith, offers to recognize my authority over [td_target.GetName], become my vassal, and join my war. In return, their vassal contract must guarantee religious protection.\n\nIf I refuse, they will choose again whether to resist, remain neutral, or submit without this protection."
 title_domination.0003.grant:0 "Their faith will be protected."
 title_domination.0003.refuse:0 "I will grant no such protection."
 title_domination.0004.t:0 "Religious Protection Refused"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] has refused my request for religious protection. I must decide whether to fight, remain neutral, or swear fealty without this guarantee."
 title_domination.0004.ok:0 "Then I must choose again."
 title_domination.0010.t:0 "The Fate of [td_target.GetName]"
 title_domination.0010.victory_desc:0 "The struggle for domination is over. My authority over [td_target.GetName] has been secured, and the title remains mine."
 title_domination.0010.defeat_desc:0 "My attempt to dominate [td_target.GetName] has failed. The proclaimed title is destroyed, the de jure rulers who joined this campaign regain their independence, and reparations are owed to those who resisted."
 title_domination.0010.ok:0 "The matter is settled."
 td_domination_cb:0 "Title Domination"
 td_domination_war:0 "War for Title Domination"
 td_domination_victory:0 "Domination Secured"
 td_domination_defeat:0 "Domination Defeated"
 td_preview_defenders_tt:0 "De jure rulers called upon in this campaign:"
 td_start_tt:0 "Pay the cost and proclaim the title. Rulers answer strongest first within the same day; war follows all replies. Beginning starts a ten-year cooldown: victory, an uncontested title or a refunded technical cancellation clears it; defeat keeps its remaining duration."
 td_join_tt:0 "You become a vassal of the dominant ruler and join their side when the common war begins. If they lose this campaign, you regain independence. This choice must be compatible with everyone who has already committed to a side."
 td_religion_tt:0 "Request religious protection in your vassal contract. If accepted, you become a vassal and join the dominant ruler's side. If refused, you choose again without this option."
 td_neutral_tt:0 "You stay out of the war and retain your lands and existing political status. You receive no share of any reparations."
 td_fight_tt:0 "You join the common war against the dominant ruler once the other replies arrive. If the campaign fails, you receive a share of the reparations."
 td_victory_tt:0 "The dominant ruler keeps the proclaimed title."
 td_defeat_tt:0 "The proclaimed title is destroyed. The de jure rulers who joined the dominant regain independence, and reparations are divided among those who resisted."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "The Coalition Could Not Assemble"
 title_domination.0007.desc:0 "The military situation changed after the replies, or the promised participants could not enter one common war. No accepted participant will be silently excluded. The attempt to dominate [td_target.GetName] has been cancelled and its full gold and prestige cost returned.\n\nThe provisional title is dissolved and the rulers who submitted for this campaign are released. Their other wars continue unchanged."
 title_domination.0007.ok:0 "I must reconsider this campaign."
 td_oath_current_war_desc:0 "\n\nI am already fighting the dominant ruler in another war. I cannot enter a second common war with them or swear fealty while that conflict continues. Remaining neutral leaves our existing war unchanged."
 td_oath_current_war_tt:0 "You cannot swear fealty while you are already an enemy of the dominant ruler in another war. That existing war will not be ended by this decision."
 td_fight_military_available_tt:0 "This response must still be current. Your wars must allow you to oppose the dominant ruler and all accepted volunteers together with every ruler who has already chosen resistance."
 td_join_military_available_tt:0 "This response must still be current. Your wars must allow you to join the dominant ruler and all accepted volunteers against every ruler who has already chosen resistance."
 td_religion_grant_available_tt:0 "The request must still be current and eligible for religious protection. The requesting ruler's wars must still allow them to join your side of the common war."
 td_legacy_campaign_title:0 "An Earlier Campaign"
 td_legacy_campaign_desc:0 "The former waiting and delayed-support rules are no longer used. An unfinished attempt under those rules is cancelled, its preparation costs returned, its provisional title dissolved and the rulers who submitted for it released. Existing wars are left unchanged."
 td_legacy_campaign_close:0 "Understood."
 td_oath_rejected_desc:0 "\n\nThe oath could not be established. I may now resist, if that choice is available, or remain neutral."

# Forecast snapshot and voluntary diplomatic consequences.
 td_fc_header_tt:0 "#T Forecast from the most likely responses#!"
 td_fc_own_tt:0 "#high Your realm:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] of your projected side)."
 td_fc_support_header_tt:0 "#P Expected support:#! [SCOPE.ScriptValue('td_fc_support_count_value')|0] rulers, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Expected resistance:#! [SCOPE.ScriptValue('td_fc_fighters_count_value')|0] rulers, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Expected neutrality:#! [SCOPE.ScriptValue('td_fc_neutral_count_value')|0] rulers, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Conditional support:#! [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] rulers / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] are predicted to request religious protection. This scenario assumes you grant it and their oath succeeds."
 td_fc_ratio_tt:0 "#high Projected forces:#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] on your side versus [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] in resistance ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "No force ratio is calculated: projected resistance has [soldier_i] 0 soldiers."
 td_fc_caveat_tt:0 "#weak Snapshot: one highest-weight individual response per ruler, not the mathematical expectation of sides. Chances use AI weights; players and earlier replies can change the result. Current soldiers exclude outside allies and future recruitment, and do not measure victory chance. Support shares use your whole side; other shares use their group.#!"
 td_diplomacy_begin_tt:0 "#warning Only a real war breaks pacts.#! Per attacked ally: broken alliance, −250 prestige and −1 fame level. Per outgoing truce: −250 prestige, −1 fame level and rank-scaled legitimacy loss. Also, three-year opinion modifiers apply: −25 for attacking allies and −50 for breaking truces, once per type. Resource costs accumulate per opponent; perks and special exemptions apply. Defenders, neutrals and no-war campaigns pay none."
 td_diplomacy_join_tt:0 "#warning You join the attacking side.#! Your own alliances and outgoing truces with defenders can incur the same prestige, fame and truce-legitimacy costs per opponent, plus opinion modifiers. Religious protection is no exemption; no war means no penalties."
 td_diplomacy_defend_tt:0 "Defending against the dominant ruler does not make you an alliance or truce breaker. The attacking side is responsible for the pacts it violates."
 td_fc_support_rest_tt:0 "Further [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0] rulers: [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
