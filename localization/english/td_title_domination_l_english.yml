 td_fc_neutral_rest_tt:0 "Further [SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0] rulers: [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]."
 td_fc_neutral_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_1_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_neutral_1_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_neutral_1_probability_value')|%0]."
 td_fc_neutral_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_2_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_neutral_2_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_neutral_2_probability_value')|%0]."
 td_fc_neutral_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_3_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_neutral_3_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_neutral_3_probability_value')|%0]."
 td_fc_neutral_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_4_strength_value')|0]; share [SCOPE.ScriptValue('td_fc_neutral_4_share_value')|%0]; response chance [SCOPE.ScriptValue('td_fc_neutral_4_probability_value')|%0]."
