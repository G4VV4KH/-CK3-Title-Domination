 rule_td_ai_frequency:0 "Title Domination: AI Campaign Frequency"
 setting_td_ai_off:0 "Off"
 setting_td_ai_off_desc:0 "AI rulers can respond to domination but cannot start campaigns of their own."
 setting_td_ai_rare:0 "Rare"
 setting_td_ai_rare_desc:0 "Each year, AI rulers have a small chance to consider one nearby title. They require ample reserves and overwhelming military strength."
 setting_td_ai_medium:0 "Medium"
 setting_td_ai_medium_desc:0 "AI rulers may search nearby titles each year. They keep a reserve and seek an advantage over likely opponents."
