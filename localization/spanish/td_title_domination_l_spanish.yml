 td_fc_fighters_row_5_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_5.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_5_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_fighters_5_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_fighters_5_probability_value')|%0]."
 td_fc_neutral_rest_tt:0 "Otros [SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0] gobernantes: [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]."
 td_fc_neutral_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_1_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_neutral_1_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_neutral_1_probability_value')|%0]."
 td_fc_neutral_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_2_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_neutral_2_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_neutral_2_probability_value')|%0]."
 td_fc_neutral_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_3_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_neutral_3_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_neutral_3_probability_value')|%0]."
