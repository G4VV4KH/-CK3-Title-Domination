 td_fc_support_row_3_conditional_tt:0 "$td_fc_support_row_3_tt$ #warning Protección de la fe.#!"
 td_fc_support_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_4_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_support_4_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_support_4_probability_value')|%0]."
