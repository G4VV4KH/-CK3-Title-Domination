 td_fc_neutral_rest_tt:0 "Otros [SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0] gobernantes: [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]."
