 td_fc_unavailable_tt:0 "El pronóstico no está disponible en esta vista previa antigua. Ciérrala y vuelve a abrir la acción del título para obtener una instantánea nueva."
 td_settlement_truce_tt:0 "[truce|E] unilateral: [attacker.GetShortUIName|U] → [defender.GetShortUIName], al menos #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! días. Se conserva cualquier tregua existente de mayor duración."
