l_spanish:
 td_title_button:0 "Dominación"
 td_title_button_tt:0 "Examina a los gobernantes de iure antes de proclamar este título e iniciar una guerra de dominación. El oro y el prestigio indicados se cobran al comenzar.\n\nDebes estar en paz y disponer de suficientes recursos de ambos tipos. Un intento de dominación en curso o un plazo de espera sin vencer también bloquean esta acción.\n\n"
 td_cooldown_available_tt:0 "Tiempo hasta otro intento de dominación: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Dominación sobre [td_target.GetName]"
 title_domination.0001.desc:0 "[td_target.GetName] no tiene titular. Puedo proclamar el título y exigir reconocimiento a los gobernantes de sus tierras de iure. Pueden resistirse, mantenerse neutrales o jurarme lealtad si su rango lo permite.\n\nLa campaña cuesta [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! y [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. El precio depende del rango del título, de sus tierras y de su distancia respecto a mi señorío.\n\nLa victoria asegura el título. La derrota lo destruye, libera a los gobernantes de iure que se unieron a mí y exige reparaciones para quienes resistieron."
 title_domination.0001.begin:0 "Comenzar la expansión."
 title_domination.0001.cancel:0 "Abandonar la expansión."
 title_domination.0002.t:0 "Una pretensión de dominación"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] ha proclamado [td_target.GetName] y exige el reconocimiento de sus gobernantes de iure. Tras recibir las respuestas, comenzará una guerra común contra quienes decidan resistir.\n\nPuedo resistir, permanecer neutral o jurar lealtad si mi rango lo permite. Una fe distinta puede darme derecho a solicitar protección religiosa. Una respuesta militar no estará disponible si mis guerras actuales son incompatibles con el gobernante dominante o con alguien que ya haya elegido bando. Las guerras ajenas a este conflicto no impiden responder.\n\nLos gobernantes responden uno a uno, empezando por el ejército restante más fuerte. Las negociaciones religiosas terminan antes de dirigirse al siguiente gobernante. Las respuestas se suceden inmediatamente en el mismo día; en una partida individual, la pausa habitual de los eventos detiene el tiempo mientras el jugador elige."
 title_domination.0002.fight:0 "Lucharé contra el gobernante dominante."
 title_domination.0002.ignore:0 "Esta lucha no es mía."
 title_domination.0002.join:0 "Juraré lealtad y me uniré a la guerra."
 title_domination.0002.religion:0 "Proteged mi fe y juraré lealtad."
 title_domination.0003.t:0 "Una solicitud de protección religiosa"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], gobernante de otra fe, ofrece reconocer mi autoridad sobre [td_target.GetName], convertirse en mi vasallo y unirse a mi guerra. A cambio, su contrato vasallático debe garantizar la protección religiosa.\n\nSi me niego, deberá volver a elegir entre resistir, permanecer neutral o someterse sin esa protección."
 title_domination.0003.grant:0 "Su fe estará protegida."
 title_domination.0003.refuse:0 "No concederé esa protección."
 title_domination.0004.t:0 "Protección religiosa denegada"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] ha rechazado mi solicitud de protección religiosa. Debo decidir si lucho, permanezco neutral o juro lealtad sin esa garantía."
 title_domination.0004.ok:0 "Entonces debo volver a elegir."
 title_domination.0010.t:0 "El destino de [td_target.GetName]"
 title_domination.0010.victory_desc:0 "La lucha por la dominación ha terminado. Mi autoridad sobre [td_target.GetName] está asegurada y el título sigue siendo mío."
 title_domination.0010.defeat_desc:0 "Mi intento de dominar [td_target.GetName] ha fracasado. El título proclamado se destruye, los gobernantes de iure que se unieron a la campaña recuperan su independencia y se deben reparaciones a quienes resistieron."
 title_domination.0010.ok:0 "El asunto está resuelto."
 td_domination_cb:0 "Dominación de un título"
 td_domination_war:0 "Guerra por la dominación de un título"
 td_domination_victory:0 "Dominación asegurada"
 td_domination_defeat:0 "Dominación derrotada"
 td_preview_defenders_tt:0 "Gobernantes de iure convocados en esta campaña:"
 td_start_tt:0 "Paga el coste y proclama el título. Los gobernantes responden el mismo día, los más fuertes primero; la guerra comienza tras todas las respuestas. El inicio impone una espera de diez años: una victoria, un título sin oposición o una cancelación técnica con reembolso la eliminan; una derrota conserva el plazo restante."
 td_join_tt:0 "Te conviertes en vasallo del gobernante dominante y te unes a su bando al comenzar la guerra común. Si pierde la campaña, recuperas la independencia. Esta elección debe ser compatible con todos los que ya hayan elegido bando."
 td_religion_tt:0 "Solicita protección religiosa en tu contrato vasallático. Si se acepta, te conviertes en vasallo y te unes al bando del gobernante dominante. Si se rechaza, vuelves a elegir sin esta opción."
 td_neutral_tt:0 "Permaneces fuera de la guerra y conservas tus tierras y tu condición política. No recibes parte alguna de las reparaciones."
 td_fight_tt:0 "Te unes a la guerra común contra el gobernante dominante cuando llegan las demás respuestas. Si su campaña fracasa, recibes una parte de las reparaciones."
 td_victory_tt:0 "El gobernante dominante conserva el título proclamado."
 td_defeat_tt:0 "El título proclamado se destruye. Los gobernantes de iure que se unieron al dominante recuperan la independencia y las reparaciones se reparten entre quienes resistieron."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "La coalición no pudo reunirse"
 title_domination.0007.desc:0 "La situación militar cambió después de las respuestas, o los participantes comprometidos no pudieron entrar en una guerra común. Ningún participante aceptado será excluido sin aviso. El intento de dominar [td_target.GetName] se ha cancelado y se ha devuelto todo su coste en oro y prestigio.\n\nEl título provisional se disuelve y los gobernantes sometidos para esta campaña quedan libres. Sus otras guerras continúan sin cambios."
 title_domination.0007.ok:0 "Debo reconsiderar esta campaña."
 td_oath_current_war_desc:0 "\n\nYa lucho contra el gobernante dominante en otra guerra. No puedo participar en una segunda guerra común con él ni jurarle lealtad mientras continúe ese conflicto. Permanecer neutral deja intacta nuestra guerra actual."
 td_oath_current_war_tt:0 "No puedes jurar lealtad mientras seas enemigo del gobernante dominante en otra guerra. Esta decisión no pondrá fin a ese conflicto."
 td_fight_military_available_tt:0 "Esta respuesta debe seguir vigente. Tus guerras deben permitirte enfrentarte al gobernante dominante y a todos los voluntarios aceptados junto a todos los gobernantes que ya hayan elegido resistir."
 td_join_military_available_tt:0 "Esta respuesta debe seguir vigente. Tus guerras deben permitirte unirte al gobernante dominante y a todos los voluntarios aceptados contra todos los gobernantes que ya hayan elegido resistir."
 td_religion_grant_available_tt:0 "La solicitud debe seguir vigente y cumplir los requisitos de protección religiosa. Las guerras del solicitante deben seguir permitiéndole unirse a tu bando en la guerra común."
 td_legacy_campaign_title:0 "Una campaña anterior"
 td_legacy_campaign_desc:0 "Las antiguas reglas de espera y apoyo diferido ya no se utilizan. Un intento pendiente bajo esas reglas se cancela, sus costes de preparación se devuelven, su título provisional se disuelve y los gobernantes sometidos quedan libres. Las guerras existentes no cambian."
 td_legacy_campaign_close:0 "Entendido."
 td_oath_rejected_desc:0 "\n\nEl juramento no pudo establecerse. Ahora puedo resistir, si esa opción está disponible, o permanecer neutral."
 td_fc_header_tt:0 "#T Pronóstico según las respuestas más probables#!"
 td_fc_own_tt:0 "#high Tu señorío:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] de tu bando previsto)."
 td_fc_support_header_tt:0 "#P Apoyo previsto:#! [SCOPE.ScriptValue('td_fc_support_count_value')|0] gobernantes, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Resistencia prevista:#! [SCOPE.ScriptValue('td_fc_fighters_count_value')|0] gobernantes, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Neutralidad prevista:#! [SCOPE.ScriptValue('td_fc_neutral_count_value')|0] gobernantes, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Apoyo condicionado:#! se prevé que [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] gobernantes / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] soliciten protección religiosa. Este escenario supone que la concedes y que su juramento se cumple."
 td_fc_ratio_tt:0 "#high Fuerzas previstas:#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] en tu bando contra [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] en la resistencia ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "No se calcula una proporción de fuerzas: la resistencia prevista tiene [soldier_i] 0 soldados."
 td_fc_caveat_tt:0 "#weak Instantánea: una respuesta individual de mayor peso por gobernante, no la esperanza matemática de los bandos. Las probabilidades usan los pesos de la IA; los jugadores y las respuestas previas pueden cambiar el resultado. Las tropas actuales excluyen aliados externos y futuros reclutamientos, y no indican una probabilidad de victoria. Las cuotas de apoyo se calculan sobre todo tu bando; las demás, sobre su propio grupo.#!"
 td_diplomacy_begin_tt:0 "#warning Solo una guerra real rompe los pactos.#! Por cada aliado atacado: ruptura de la alianza, −250 de prestigio y −1 nivel de fama. Por cada tregua que vulneres: −250 de prestigio, −1 nivel de fama y pérdida de legitimidad según el rango. Además, se aplican modificadores de opinión durante tres años: −25 por atacar aliados y −50 por romper treguas, una vez por tipo. Las pérdidas de recursos se acumulan por adversario; se aplican las ventajas y exenciones especiales. Los defensores, los neutrales y las campañas sin guerra no sufren sanciones."
 td_diplomacy_join_tt:0 "#warning Te unes al bando atacante.#! Tus propias alianzas y treguas con los defensores pueden causar las mismas pérdidas de prestigio, fama y, por treguas, legitimidad por adversario, además de modificadores de opinión. La protección religiosa no te exime; sin guerra no hay sanciones."
 td_diplomacy_defend_tt:0 "Defenderse del gobernante dominante no te convierte en infractor de una alianza o tregua. El bando atacante responde por los pactos que viola."
 td_fc_support_rest_tt:0 "Otros [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0] gobernantes: [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
 td_fc_support_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_1_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_support_1_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_support_1_probability_value')|%0]."
 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning Protección de la fe.#!"
