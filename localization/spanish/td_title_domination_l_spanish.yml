 td_fc_unavailable_tt:0 "El pronóstico no está disponible en esta vista previa antigua. Ciérrala y vuelve a abrir la acción del título para obtener una instantánea nueva."
 td_settlement_truce_tt:0 "[truce|E] unilateral: [attacker.GetShortUIName|U] → [defender.GetShortUIName], al menos #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! días. Se conserva cualquier tregua existente de mayor duración."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Gobernantes protegidos por tus pactos#!"

 td_dp_start_desc:0 "\n\nTus pactos protegen a [TopScope.GetValue('td_dp_count')|0] gobernantes de iure. Pueden permanecer neutrales o jurar vasallaje si su rango lo permite. Se respetan tus pactos sin pérdida de fama."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — alianza"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — tregua que te obliga"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — tregua que obliga a este gobernante"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "Del reconocimiento a la sumisión"
 title_domination.0100.desc:0 "Me he asegurado el título [td_target.GetName]. Puedo poner fin a la campaña o exigir la sumisión de los demás gobernantes de iure, incluidos quienes se mantuvieron neutrales. Pueden resistirse o jurar vasallaje. Un pacto les permite permanecer neutrales."
 title_domination.0100.start:0 "Exigir la sumisión de los demás gobernantes."
 title_domination.0100.finish:0 "Terminar la campaña conservando el título."
 td_subjugation_cb:0 "Subyugación de iure"
 td_subjugation_war:0 "Guerra de subyugación de iure"
 td_subjugation_victory:0 "Tierras de iure subyugadas"
 td_subjugation_defeat:0 "Subyugación rechazada"
 td_subjugation_start_tt:0 "Los preparativos ya están pagados. Los gobernantes más fuertes responden primero. Quienes juren vasallaje pueden solicitar protección religiosa. Solo se combate contra quienes se resisten. Si vences, los gobernantes de rango inferior que puedan ser vasallizados se convertirán en tus vasallos con todos sus dominios. Los demás solo cederán las tierras de iure disputadas. Si pierdes, conservarás el título y a tus vasallos voluntarios."
 td_subjugation_finish_tt:0 "Conserva el título asegurado y los vasallos voluntarios y termina la campaña. Obtienes treguas unilaterales con los gobernantes que resistieron en la primera guerra y siguen fuera de tu territorio; se conservan las treguas existentes más largas. No habrá una segunda guerra."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — posible participante en las respuestas, con tierras de iure fuera de tu señorío."

 td_subjugation_compatible_tt:0 "La oferta debe seguir vigente y el gobernante dominante debe ser independiente y estar en paz. Cada respuesta y las guerras que se formen se comprueban frente a la situación militar actual y el modo elegido."
 td_subjugation_truce_name:0 "La campaña de dominación ha terminado"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] se ha asegurado el título [td_target.GetName] y exige mi sumisión. Puedo resistirme o jurar vasallaje si mi rango lo permite, y pedir protección religiosa si cumplo los requisitos. Un pacto con el gobernante dominante o con un vasallo que ya se haya sumado me permite permanecer neutral y conservar mis tierras."
 td_subjugation_fight_tt:0 "Alzarse en armas contra el sometimiento. Si pierde, un gobernante independiente de rango inferior se convierte en vasallo del vencedor y conserva sus títulos, tierras y vasallos, incluidos los de fuera del título disputado. Si el vasallaje es imposible, la paz solo afecta a las tierras de iure disputadas. Si fracasa el ataque, el dominante conserva el título y los vasallos voluntarios. Esta guerra no conlleva reparaciones."
 td_subjugation_join_tt:0 "Te conviertes en vasallo y seguirás siéndolo aunque el gobernante dominante pierda esta fase."
 title_domination.0002.unavailable:0 "No puedo participar."
 td_subjugation_response_blocked_tt:0 "La situación militar actual no deja ninguna respuesta válida en esta segunda fase. Se cancela el sometimiento; se conservan el título asegurado y todas las lealtades voluntarias. No se termina por la fuerza ninguna otra guerra."
 title_domination.0101.t:0 "No pudo comenzar el sometimiento"
 title_domination.0101.desc:0 "La situación militar cambió y no pudo iniciarse el sometimiento. El título asegurado y todos los gobernantes sometidos voluntariamente permanecen bajo la autoridad del dominante. La campaña ha terminado sin otro pago de preparación."
 title_domination.0101.ok:0 "Entendido."
 rule_td_subjugation_war_mode:0 "Title Domination: guerras de sometimiento"
 setting_td_subjugation_coalition:0 "Coalición común"
 setting_td_subjugation_coalition_desc:0 "En la segunda fase, todos los resistentes se defienden juntos en una guerra con un resultado común. La primera fase no cambia."
 setting_td_subjugation_individual:0 "Guerras individuales"
 setting_td_subjugation_individual_desc:0 "En la segunda fase, cada resistente se enfrenta a una guerra separada con su propio resultado. Terminar una guerra no termina las demás. La primera fase no cambia."
 td_subjugation_individual_cb:0 "Sometimiento de iure individual"
 td_subjugation_individual_war:0 "Guerra de sometimiento de iure individual — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "Tierras de iure sometidas"
 td_subjugation_individual_defeat:0 "Sometimiento individual rechazado"
 td_subjugation_mode_coalition_tt:0 "#bold Coalición común:#! todos los resistentes se defienden en una sola guerra de la segunda fase con un resultado común."
 td_subjugation_mode_individual_tt:0 "#bold Guerras individuales:#! cada resistente se enfrenta a su propia guerra de la segunda fase. La victoria o derrota resuelve solo la guerra contra ese adversario; las demás continúan. La derrota conserva el título asegurado y todos los vasallos voluntarios, y concede una tregua solo al defensor principal de esa guerra."
