 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning Protección de la fe.#!"
 td_fc_fighters_rest_tt:0 "Otros [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0] gobernantes: [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
 td_fc_fighters_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_2_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_fighters_2_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_fighters_2_probability_value')|%0]."
 td_fc_fighters_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_3_strength_value')|0]; cuota [SCOPE.ScriptValue('td_fc_fighters_3_share_value')|%0]; probabilidad de respuesta [SCOPE.ScriptValue('td_fc_fighters_3_probability_value')|%0]."
