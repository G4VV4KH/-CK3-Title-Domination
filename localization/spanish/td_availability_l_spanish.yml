l_spanish:
 rule_td_domination_territory:0 "Dominación de títulos: títulos disponibles"
 setting_td_territory_all:0 "Todos los títulos"
 setting_td_territory_all_desc:0 "La dominación puede dirigirse contra un título sin crear en cualquier parte del mapa."
 setting_td_territory_realm:0 "Un condado de tu señorío"
 setting_td_territory_realm_desc:0 "Tu señorío debe incluir al menos un condado de iure del título elegido. También cuentan los condados de tus vasallos."
 setting_td_territory_capital:0 "Títulos a los que pertenece tu capital"
 setting_td_territory_capital_desc:0 "El condado de la capital de tu señorío debe pertenecer de iure al título elegido."
 td_discover_domination_decision:0 "Puedes declarar la dominación"
 td_discover_domination_desc:0 "Elige un título sin crear cuya campaña puedas costear. En la ventana del título podrás revisar el coste de preparación y las condiciones antes de comprometerte."
 td_discover_domination_tooltip:0 "Ver los títulos disponibles para una campaña de dominación."
 td_discover_domination_confirm:0 "Abrir el título"
 rule_td_ai_frequency:0 "Title Domination: frecuencia de las campañas de la IA"
 setting_td_ai_off:0 "Nunca"
 setting_td_ai_off_desc:0 "Los gobernantes de la IA pueden responder a las exigencias de dominación, pero no inician campañas propias."
 setting_td_ai_rare:0 "Rara vez"
 setting_td_ai_rare_desc:0 "Cada año, los gobernantes de la IA tienen una pequeña probabilidad de considerar un título cercano. Exigen reservas holgadas y una superioridad militar abrumadora."
 setting_td_ai_medium:0 "Media"
 setting_td_ai_medium_desc:0 "Los gobernantes de la IA pueden examinar los títulos cercanos cada año. Mantienen una reserva y buscan ventaja sobre sus posibles oponentes."
 setting_td_ai_frequent:0 "A menudo"
 setting_td_ai_frequent_desc:0 "Cada trimestre, los gobernantes de la IA que cumplen los requisitos tienen un 25 % de probabilidad de examinar los títulos cercanos. Pueden gastar todo su presupuesto y aceptar una ligera desventaja frente a sus posibles oponentes."
