l_french:
 rule_td_domination_territory:0 "Domination des titres : titres admissibles"
 setting_td_territory_all:0 "Tous les titres"
 setting_td_territory_all_desc:0 "La domination peut viser un titre non créé où qu’il se trouve sur la carte."
 setting_td_territory_realm:0 "Un comté dans votre pays"
 setting_td_territory_realm_desc:0 "Votre pays doit comprendre au moins un comté de jure du titre visé. Les comtés détenus par vos vassaux comptent également."
 setting_td_territory_capital:0 "Titres dont relève votre capitale"
 setting_td_territory_capital_desc:0 "La capitale de votre pays doit se trouver dans un comté de jure du titre visé."
 td_discover_domination_decision:0 "Vous pouvez revendiquer la domination"
 td_discover_domination_desc:0 "Choisissez un titre non créé pour lequel vous avez les moyens de lancer une campagne. Sa fenêtre indique les frais de préparation et permet d’examiner la campagne avant de vous engager."
 td_discover_domination_tooltip:0 "Voir les titres disponibles pour une campagne de domination."
 td_discover_domination_confirm:0 "Ouvrir le titre"
 rule_td_ai_frequency:0 "Title Domination : fréquence des campagnes de l’IA"
 setting_td_ai_off:0 "Jamais"
 setting_td_ai_off_desc:0 "Les dirigeants de l’IA peuvent répondre aux exigences de domination, mais ne lancent pas leurs propres campagnes."
 setting_td_ai_rare:0 "Rarement"
 setting_td_ai_rare_desc:0 "Chaque année, les dirigeants de l’IA ont une faible chance d’envisager un titre voisin. Ils exigent des réserves confortables et une supériorité militaire écrasante."
 setting_td_ai_medium:0 "Modérément"
 setting_td_ai_medium_desc:0 "Les dirigeants de l’IA peuvent examiner les titres voisins chaque année. Ils gardent une réserve et cherchent à prendre l’avantage sur leurs adversaires probables."
 setting_td_ai_frequent:0 "Souvent"
 setting_td_ai_frequent_desc:0 "Chaque trimestre, les dirigeants de l’IA qui remplissent les conditions ont 25 % de chances d’examiner les titres voisins. Ils peuvent engager tout leur budget et accepter un léger désavantage face à leurs adversaires probables."
