l_french:
 td_title_button:0 "Domination"
 td_title_button_tt:0 "Examinez les dirigeants de jure avant de proclamer ce titre et d'entamer une guerre de domination. L'or et le prestige affichés sont prélevés au lancement.\n\nVous devez être en paix et disposer des deux ressources en quantité suffisante. Une tentative de domination en cours ou un délai de récupération non écoulé bloque également cette action.\n\n"
 td_cooldown_available_tt:0 "Délai avant une nouvelle tentative de domination : [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Domination sur [td_target.GetName]"
 title_domination.0001.desc:0 "[td_target.GetName] n'a pas de titulaire. Je peux proclamer ce titre et exiger la reconnaissance des dirigeants de ses terres de jure. Ils peuvent résister, rester neutres ou me prêter allégeance si leur rang le permet.\n\nLa campagne coûte [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! et [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. Ce prix dépend du rang du titre, de ses terres et de leur éloignement de mon pays.\n\nLa victoire assure ma possession du titre. La défaite le détruit, libère les dirigeants de jure qui m'ont rejoint et m'impose des réparations envers ceux qui ont résisté."
 title_domination.0001.begin:0 "Entamer l'expansion."
 title_domination.0001.cancel:0 "Renoncer à l'expansion."
 title_domination.0002.t:0 "Une prétention à la domination"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] a proclamé le titre de [td_target.GetName] et exige la reconnaissance de ses dirigeants de jure. Après réception des réponses, une guerre commune sera menée contre ceux qui auront choisi de résister.\n\nJe peux résister, rester neutre ou prêter allégeance si mon rang le permet. Une foi différente peut me permettre de demander une protection religieuse. Une réponse militaire est indisponible si mes guerres actuelles sont incompatibles avec le dirigeant dominant ou avec un dirigeant ayant déjà choisi son camp. Les guerres sans rapport n'empêchent pas de répondre.\n\nLes dirigeants répondent à tour de rôle, en commençant par la plus forte armée restante. Les négociations religieuses se terminent avant de solliciter le dirigeant suivant. Les réponses s'enchaînent immédiatement le même jour ; en solo, la pause habituelle des événements suspend le temps pendant le choix d'un joueur."
 title_domination.0002.fight:0 "Je combattrai le dirigeant dominant."
 title_domination.0002.ignore:0 "Ce conflit n'est pas le mien."
 title_domination.0002.join:0 "Je prêterai allégeance et rejoindrai la guerre."
 title_domination.0002.religion:0 "Protégez ma foi et je prêterai allégeance."
 title_domination.0003.t:0 "Une demande de protection religieuse"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], adepte d'une autre foi, propose de reconnaître mon autorité sur [td_target.GetName], de devenir mon vassal et de participer à ma guerre. En échange, son contrat vassalique doit garantir une protection religieuse.\n\nSi je refuse, ce dirigeant devra choisir à nouveau entre résister, rester neutre et se soumettre sans cette protection."
 title_domination.0003.grant:0 "Sa foi sera protégée."
 title_domination.0003.refuse:0 "Je n'accorderai pas cette protection."
 title_domination.0004.t:0 "Protection religieuse refusée"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] a refusé ma demande de protection religieuse. Je dois décider de combattre, de rester neutre ou de prêter allégeance sans cette garantie."
 title_domination.0004.ok:0 "Je dois donc choisir à nouveau."
 title_domination.0010.t:0 "Le sort de [td_target.GetName]"
 title_domination.0010.victory_desc:0 "La lutte pour la domination est terminée. Mon autorité sur [td_target.GetName] est établie et le titre reste mien."
 title_domination.0010.defeat_desc:0 "Ma tentative de domination sur [td_target.GetName] a échoué. Le titre proclamé est détruit, les dirigeants de jure qui m'ont rejoint retrouvent leur indépendance et des réparations sont dues à ceux qui ont résisté."
 title_domination.0010.ok:0 "L'affaire est réglée."
 td_domination_cb:0 "Domination d'un titre"
 td_domination_war:0 "Guerre de domination d'un titre"
 td_domination_victory:0 "Domination assurée"
 td_domination_defeat:0 "Domination repoussée"
 td_preview_defenders_tt:0 "Dirigeants de jure sollicités pour cette campagne :"
 td_start_tt:0 "Payez le coût et proclamez le titre. Les dirigeants répondent le même jour, du plus puissant au plus faible ; la guerre suit toutes les réponses. Le lancement impose un délai de dix ans : une victoire, un titre sans opposition ou une annulation technique remboursée l'efface ; une défaite conserve le temps restant."
 td_join_tt:0 "Vous devenez vassal du dirigeant dominant et rejoignez son camp au début de la guerre commune. S'il perd cette campagne, vous retrouvez votre indépendance. Ce choix doit être compatible avec tous les dirigeants déjà engagés dans un camp."
 td_religion_tt:0 "Demandez une protection religieuse dans votre contrat vassalique. Si elle est accordée, vous devenez vassal et rejoignez le camp du dirigeant dominant. En cas de refus, vous choisissez à nouveau sans cette option."
 td_neutral_tt:0 "Vous restez hors de la guerre et conservez vos terres ainsi que votre statut politique. Vous ne recevez aucune part des réparations."
 td_fight_tt:0 "Vous rejoignez la guerre commune contre le dirigeant dominant après réception des autres réponses. Si sa campagne échoue, vous recevez une part des réparations."
 td_victory_tt:0 "Le dirigeant dominant conserve le titre proclamé."
 td_defeat_tt:0 "Le titre proclamé est détruit. Les dirigeants de jure ayant rejoint le dominant retrouvent leur indépendance et les réparations sont réparties entre les résistants."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "La coalition n'a pas pu se réunir"
 title_domination.0007.desc:0 "La situation militaire a changé après les réponses, ou les participants engagés n'ont pas pu rejoindre une guerre commune. Aucun participant accepté ne sera écarté silencieusement. La tentative de domination sur [td_target.GetName] est annulée et l'intégralité de son coût en or et en prestige est remboursée.\n\nLe titre provisoire est dissous et les dirigeants soumis pour cette campagne sont libérés. Leurs autres guerres se poursuivent sans changement."
 title_domination.0007.ok:0 "Je dois repenser cette campagne."
 td_oath_current_war_desc:0 "\n\nJe combats déjà le dirigeant dominant dans une autre guerre. Je ne peux pas participer à une deuxième guerre commune avec lui ni lui prêter allégeance tant que ce conflit dure. Rester neutre ne change rien à notre guerre actuelle."
 td_oath_current_war_tt:0 "Vous ne pouvez pas prêter allégeance alors que vous êtes déjà l'ennemi du dirigeant dominant dans une autre guerre. Cette décision ne mettra pas fin à ce conflit."
 td_fight_military_available_tt:0 "Cette réponse doit encore être d'actualité. Vos guerres doivent vous permettre d'affronter le dirigeant dominant et tous ses volontaires aux côtés de tous les dirigeants ayant déjà choisi de résister."
 td_join_military_available_tt:0 "Cette réponse doit encore être d'actualité. Vos guerres doivent vous permettre de rejoindre le dirigeant dominant et tous ses volontaires contre tous les dirigeants ayant déjà choisi de résister."
 td_religion_grant_available_tt:0 "La demande doit encore être d'actualité et permettre une protection religieuse. Les guerres du demandeur doivent toujours lui permettre de rejoindre votre camp dans la guerre commune."
 td_legacy_campaign_title:0 "Une ancienne campagne"
 td_legacy_campaign_desc:0 "Les anciennes règles d'attente et de soutien différé ne sont plus utilisées. Une tentative inachevée sous ces règles est annulée, ses frais de préparation sont remboursés, son titre provisoire est dissous et les dirigeants soumis sont libérés. Les guerres existantes restent inchangées."
 td_legacy_campaign_close:0 "Compris."
 td_oath_rejected_desc:0 "\n\nLe serment n'a pas pu être établi. Je peux désormais résister, si cette réponse est disponible, ou rester neutre."
 td_fc_header_tt:0 "#T Prévision selon les réponses les plus probables#!"
 td_fc_own_tt:0 "#high Votre pays :#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] de votre camp prévu)."
 td_fc_support_header_tt:0 "#P Soutien prévu :#! [SCOPE.ScriptValue('td_fc_support_count_value')|0] dirigeants, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Résistance prévue :#! [SCOPE.ScriptValue('td_fc_fighters_count_value')|0] dirigeants, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Neutralité prévue :#! [SCOPE.ScriptValue('td_fc_neutral_count_value')|0] dirigeants, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Soutien conditionnel :#! [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] dirigeants / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] devraient demander une protection religieuse. Ce scénario suppose que vous l'accordez et que leur serment aboutit."
 td_fc_ratio_tt:0 "#high Forces prévues :#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] dans votre camp contre [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] dans la résistance ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "Aucun rapport de forces n'est calculé : la résistance prévue compte [soldier_i] 0 soldats."
 td_fc_caveat_tt:0 "#weak Instantané : une réponse au poids le plus élevé par dirigeant, et non l'espérance mathématique des camps. Les chances reposent sur les poids de l'IA ; les joueurs et les réponses précédentes peuvent modifier le résultat. Les effectifs actuels excluent les alliés extérieurs et les recrutements futurs, et ne représentent pas une probabilité de victoire. La part des soutiens se rapporte à votre camp entier ; celle des autres à leur propre groupe.#!"
 td_diplomacy_begin_tt:0 "#warning Seule une guerre réelle rompt les accords.#! Par allié attaqué : rupture de l'alliance, −250 de prestige et −1 niveau de gloire. Par trêve que vous enfreignez : −250 de prestige, −1 niveau de gloire et perte de légitimité selon le rang. Des modificateurs d'opinion s'appliquent aussi pendant trois ans : −25 pour une attaque contre des alliés et −50 pour une rupture de trêve, une fois par type. Les pertes de ressources se cumulent par adversaire ; les aptitudes et exemptions particulières s'appliquent. Défenseurs, neutres et campagnes sans guerre ne subissent aucune pénalité."
 td_diplomacy_join_tt:0 "#warning Vous rejoignez le camp attaquant.#! Vos alliances et trêves envers les défenseurs peuvent entraîner les mêmes pertes de prestige, de gloire et, pour les trêves, de légitimité par adversaire, ainsi que les modificateurs d'opinion. La protection religieuse n'en dispense pas ; sans guerre, aucune pénalité."
 td_diplomacy_defend_tt:0 "Se défendre contre le dirigeant dominant ne fait pas de vous un briseur d'alliance ou de trêve. Le camp attaquant est responsable des accords qu'il viole."
 td_fc_support_rest_tt:0 "Autres [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0] dirigeants : [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
