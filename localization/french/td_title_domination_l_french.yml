 td_fc_unavailable_tt:0 "Prévision indisponible dans cet ancien aperçu. Fermez-le et rouvrez l'action du titre pour obtenir un nouvel instantané."
 td_settlement_truce_tt:0 "[truce|E] unilatérale : [attacker.GetShortUIName|U] → [defender.GetShortUIName], au moins #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! jours. Une trêve existante plus longue est conservée."
