 td_fc_unavailable_tt:0 "Prévision indisponible dans cet ancien aperçu. Fermez-le et rouvrez l'action du titre pour obtenir un nouvel instantané."
 td_settlement_truce_tt:0 "[truce|E] unilatérale : [attacker.GetShortUIName|U] → [defender.GetShortUIName], au moins #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! jours. Une trêve existante plus longue est conservée."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Souverains protégés par vos pactes#!"

 td_dp_start_desc:0 "\n\nVos pactes protègent [TopScope.GetValue('td_dp_count')|0] souverains de jure. Ils peuvent rester neutres ou prêter serment si leur rang le permet. Vos pactes sont respectés sans perte de renommée."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — alliance conclue"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — trêve qui vous lie"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — trêve qui lie ce souverain"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "De la reconnaissance à la soumission"
 title_domination.0100.desc:0 "Le titre [td_target.GetName] est désormais mien. Je peux arrêter la campagne ou exiger la soumission des autres souverains de jure, y compris de ceux qui sont restés neutres. Ils peuvent résister ou prêter serment. Un pacte leur permet de rester neutres."
 title_domination.0100.start:0 "Exiger la soumission des dirigeants restants."
 title_domination.0100.finish:0 "Terminer la campagne en conservant le titre."
 td_subjugation_cb:0 "Soumission de jure"
 td_subjugation_war:0 "Guerre de soumission de jure"
 td_subjugation_victory:0 "Terres de jure soumises"
 td_subjugation_defeat:0 "Soumission repoussée"
 td_subjugation_start_tt:0 "Les préparatifs sont déjà payés. Les plus puissants répondent en premier. Les dirigeants qui prêtent serment peuvent demander la protection de leur foi. Seuls les résistants prennent les armes. La victoire fait des dirigeants de rang inférieur vos vassaux avec toutes leurs terres lorsque leur rang et leur statut le permettent. Les autres ne cèdent que les terres de jure disputées. En cas de défaite, vous gardez le titre acquis et vos vassaux volontaires."
 td_subjugation_finish_tt:0 "Conservez le titre acquis et les vassaux volontaires, puis terminez la campagne. Vous obtenez des trêves unilatérales avec les dirigeants qui ont résisté lors de la première guerre et restent hors de votre territoire ; les trêves existantes plus longues sont conservées. Il n’y aura pas de seconde guerre."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — dirigeant susceptible de répondre, possédant des terres de jure hors de votre royaume."

 td_subjugation_compatible_tt:0 "L’offre doit toujours être valable, et le dirigeant dominant doit être indépendant et en paix. Chaque réponse et les guerres à former sont vérifiées selon la situation militaire et le mode choisi."
 td_subjugation_truce_name:0 "La campagne de domination est terminée"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] a obtenu le titre [td_target.GetName] et exige ma soumission. Je peux résister ou prêter serment si mon rang le permet, en demandant une protection religieuse si possible. Un pacte avec le souverain dominant ou un volontaire déjà engagé me permet de rester neutre et de garder mes terres."
 td_subjugation_fight_tt:0 "Prendre les armes contre la soumission. En cas de défaite, un dirigeant indépendant de rang inférieur devient le vassal du vainqueur et conserve ses titres, ses terres et ses vassaux, y compris hors du titre disputé. Si la vassalisation est impossible, seules les terres de jure disputées sont concernées. Si l’attaque échoue, le dirigeant dominant conserve le titre acquis et ses vassaux volontaires. Cette guerre n’entraîne aucune réparation."
 td_subjugation_join_tt:0 "Vous devenez vassal et le restez même si le souverain dominant perd cette phase."
 title_domination.0002.unavailable:0 "Je ne peux pas participer."
 td_subjugation_response_blocked_tt:0 "La situation militaire actuelle ne laisse aucune réponse possible dans cette seconde phase. La soumission est annulée ; le titre acquis et tous les serments volontaires sont conservés. Aucune autre guerre n’est arrêtée de force."
 title_domination.0101.t:0 "La soumission n’a pas pu commencer"
 title_domination.0101.desc:0 "La situation militaire a changé : la soumission n’a pas pu commencer. Le titre acquis et tous les dirigeants soumis volontairement restent sous l’autorité du dirigeant dominant. La campagne est terminée sans nouveaux frais de préparation."
 title_domination.0101.ok:0 "Compris."
 rule_td_subjugation_war_mode:0 "Title Domination : guerres de soumission"
 setting_td_subjugation_coalition:0 "Coalition commune"
 setting_td_subjugation_coalition_desc:0 "Dans la seconde phase, tous les résistants se défendent ensemble dans une guerre à l’issue commune. La première phase ne change pas."
 setting_td_subjugation_individual:0 "Guerres individuelles"
 setting_td_subjugation_individual_desc:0 "Dans la seconde phase, chaque résistant fait face à une guerre distincte avec sa propre issue. Terminer une guerre ne termine pas les autres. La première phase ne change pas."
 td_subjugation_individual_cb:0 "Soumission de jure individuelle"
 td_subjugation_individual_war:0 "Guerre de soumission de jure individuelle — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "Terres de jure soumises"
 td_subjugation_individual_defeat:0 "Soumission individuelle repoussée"
 td_subjugation_mode_coalition_tt:0 "#bold Coalition commune :#! tous les résistants se défendent dans une seule guerre de seconde phase, à l’issue commune."
 td_subjugation_mode_individual_tt:0 "#bold Guerres individuelles :#! chaque résistant fait face à sa propre guerre de seconde phase. Une victoire ou une défaite ne règle que la guerre contre cet adversaire ; les autres continuent. Une défaite préserve le titre acquis et tous les vassaux volontaires, et accorde une trêve uniquement au défenseur principal de cette guerre."
