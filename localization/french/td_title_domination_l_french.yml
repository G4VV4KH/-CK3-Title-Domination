 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning Protection de la foi.#!"
 td_fc_fighters_rest_tt:0 "Autres [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0] dirigeants : [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; part [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; chance de réponse [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
