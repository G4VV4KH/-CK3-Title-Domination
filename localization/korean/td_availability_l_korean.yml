l_korean:
 rule_td_domination_territory:0 "작위 지배권: 대상 작위"
 setting_td_territory_all:0 "모든 작위"
 setting_td_territory_all_desc:0 "지도 어디에서든 아직 창설되지 않은 작위를 대상으로 지배권을 선포할 수 있습니다."
 setting_td_territory_realm:0 "봉역에 속한 백작령"
 setting_td_territory_realm_desc:0 "대상 작위의 규범 권역에 속한 백작령이 내 봉역에 하나 이상 있어야 합니다. 봉신이 보유한 백작령도 포함됩니다."
 setting_td_territory_capital:0 "수도가 속한 작위"
 setting_td_territory_capital_desc:0 "봉역 수도가 있는 백작령이 대상 작위의 규범 권역에 속해야 합니다."
 td_discover_domination_decision:0 "지배권을 선포할 수 있음"
 td_discover_domination_desc:0 "원정 비용을 감당할 수 있는 미창설 작위를 선택하십시오. 작위 창에서 준비 비용과 원정 조건을 검토한 뒤 시작 여부를 결정할 수 있습니다."
 td_discover_domination_tooltip:0 "지배권을 선포할 수 있는 작위를 확인합니다."
 td_discover_domination_confirm:0 "작위 열기"
 rule_td_ai_frequency:0 "Title Domination: AI 지배 선포 빈도"
 setting_td_ai_off:0 "끄기"
 setting_td_ai_off_desc:0 "AI 통치자는 지배 요구에 대응할 수 있지만 직접 지배를 선포하지 않습니다."
 setting_td_ai_rare:0 "드물게"
 setting_td_ai_rare_desc:0 "AI 통치자는 매년 낮은 확률로 인근 작위 하나를 검토합니다. 자원에 충분한 여유가 있고 압도적인 군사적 우위를 갖춘 경우에만 원정을 시작합니다."
 setting_td_ai_medium:0 "보통"
 setting_td_ai_medium_desc:0 "AI 통치자는 매년 인근 작위를 검토할 수 있습니다. 예비 자원을 남겨 두고 예상되는 적보다 우세한 목표를 찾습니다."
 setting_td_ai_frequent:0 "자주"
 setting_td_ai_frequent_desc:0 "조건을 충족한 AI 통치자는 분기마다 25%의 확률로 인근 작위를 검토합니다. 가용 예산을 모두 쓸 수 있으며 예상되는 적보다 약간 불리해도 원정을 시작합니다."
