l_korean:
 td_title_button:0 "패권"
 td_title_button_tt:0 "이 작위를 선포하고 패권 전쟁을 시작하기 전에 규범상 통치자들을 확인합니다. 표시된 금화와 위신은 시작할 때 지불합니다.\n\n평화 상태여야 하며 두 자원 모두 충분해야 합니다. 진행 중인 패권 시도나 아직 끝나지 않은 재사용 대기시간도 이 행동을 막습니다.\n\n"
 td_cooldown_available_tt:0 "다음 패권 시도까지 남은 시간: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "[td_target.GetName]에 대한 패권"
 title_domination.0001.desc:0 "[td_target.GetName]에는 보유자가 없다. 나는 이 작위를 선포하고 규범상 영토의 통치자들에게 내 권위를 인정하라고 요구할 수 있다. 그들은 저항하거나 중립을 지킬 수 있으며, 등급이 허락한다면 충성을 맹세할 수도 있다.\n\n원정에는 [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! 및 [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!이 든다. 비용은 작위의 등급, 영토와 그 영토가 내 봉역에서 얼마나 떨어져 있는지에 따라 정해진다.\n\n승리하면 작위를 확고히 차지한다. 패배하면 작위가 파괴되고 내게 가담한 규범상 통치자들이 독립을 되찾으며, 저항한 이들에게 배상금을 지급해야 한다."
 title_domination.0001.begin:0 "확장을 시작한다."
 title_domination.0001.cancel:0 "확장을 포기한다."
 title_domination.0002.t:0 "패권 주장"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName]이 [td_target.GetName]을 선포하고 규범상 통치자들에게 권위를 인정하라고 요구했다. 모든 답변을 받으면 저항을 선택한 이들을 상대로 하나의 공동 전쟁이 시작된다.\n\n나는 저항하거나 중립을 지킬 수 있으며, 등급이 허락한다면 충성을 맹세할 수도 있다. 신앙이 다르면 종교적 보호를 요청할 자격이 있을 수 있다. 현재 전쟁이 패권 통치자나 이미 편을 정한 참여자와 충돌한다면 군사적 선택을 할 수 없다. 관계없는 전쟁은 답변을 막지 않는다.\n\n통치자들은 남은 병력이 가장 강한 순서대로 하나씩 답한다. 종교 협상은 다음 통치자에게 묻기 전에 끝난다. 답변은 같은 날 즉시 이어지며, 싱글플레이에서는 플레이어가 선택하는 동안 일반적인 이벤트 일시정지가 시간을 멈춘다."
 title_domination.0002.fight:0 "패권 통치자와 싸우겠다."
 title_domination.0002.ignore:0 "내 싸움이 아니다."
 title_domination.0002.join:0 "충성을 맹세하고 참전하겠다."
 title_domination.0002.religion:0 "내 신앙을 보호하면 충성을 맹세하겠다."
 title_domination.0003.t:0 "종교적 보호 요청"
 title_domination.0003.desc:0 "다른 신앙을 믿는 통치자 [td_requester.GetTitledFirstName]이 [td_target.GetName]에 대한 내 권위를 인정하고 내 봉신이 되어 전쟁에 가담하겠다고 제안한다. 그 대가로 봉신 계약에서 종교적 보호를 보장해야 한다.\n\n거절하면 그 통치자는 저항, 중립, 또는 보호 없는 복종 중에서 다시 선택할 것이다."
 title_domination.0003.grant:0 "그 신앙을 보호하겠다."
 title_domination.0003.refuse:0 "그런 보호는 허락하지 않겠다."
 title_domination.0004.t:0 "종교적 보호 거절"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName]이 종교적 보호 요청을 거절했다. 싸울지, 중립을 지킬지, 아니면 이 보장 없이 충성을 맹세할지 결정해야 한다."
 title_domination.0004.ok:0 "다시 선택해야겠군."
 title_domination.0010.t:0 "[td_target.GetName]의 운명"
 title_domination.0010.victory_desc:0 "패권 다툼이 끝났다. [td_target.GetName]에 대한 내 권위가 확립되었으며 작위는 내 것으로 남는다."
 title_domination.0010.defeat_desc:0 "[td_target.GetName]에 대한 패권 시도가 실패했다. 선포한 작위는 파괴되고 이번 원정에 가담한 규범상 통치자들은 독립을 되찾으며, 저항한 이들에게 배상금을 지급해야 한다."
 title_domination.0010.ok:0 "결판이 났다."
 td_domination_cb:0 "작위 패권"
 td_domination_war:0 "작위 패권 전쟁"
 td_domination_victory:0 "패권 확립"
 td_domination_defeat:0 "패권 저지"
 td_preview_defenders_tt:0 "이번 원정에서 답변을 요구받는 규범상 통치자:"
 td_start_tt:0 "비용을 지불하고 작위를 선포합니다. 통치자들은 같은 날 강한 순서대로 답하며, 모든 답변 뒤에 전쟁이 시작됩니다. 시작하면 10년의 대기시간이 적용됩니다. 승리, 저항 없는 작위 확보 또는 비용이 환불되는 기술적 취소는 대기시간을 없애며, 패배하면 남은 기간이 유지됩니다."
 td_join_tt:0 "패권 통치자의 봉신이 되어 공동 전쟁이 시작될 때 그 편에 가담합니다. 그 통치자가 이번 원정에서 패하면 독립을 되찾습니다. 이 선택은 이미 편을 정한 모든 참여자와 양립할 수 있어야 합니다."
 td_religion_tt:0 "봉신 계약에 종교적 보호를 요청합니다. 승인되면 봉신이 되어 패권 통치자 편에 가담합니다. 거절되면 이 선택지 없이 다시 선택합니다."
 td_neutral_tt:0 "전쟁에 참여하지 않으며 영토와 현재 정치적 지위를 유지합니다. 배상금은 받지 못합니다."
 td_fight_tt:0 "나머지 답변이 도착하면 패권 통치자를 상대로 하는 공동 전쟁에 가담합니다. 패권 시도가 실패하면 배상금의 일부를 받습니다."
 td_victory_tt:0 "패권 통치자가 선포한 작위를 유지합니다."
 td_defeat_tt:0 "선포한 작위가 파괴됩니다. 패권 통치자에게 가담한 규범상 통치자들은 독립을 되찾으며, 저항한 이들이 배상금을 나눕니다."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "연합을 구성할 수 없음"
 title_domination.0007.desc:0 "답변 이후 군사 상황이 바뀌었거나 약속한 참여자들이 하나의 공동 전쟁에 들어올 수 없었다. 승인된 참여자를 아무 말 없이 제외하지는 않는다. [td_target.GetName]에 대한 패권 시도가 취소되었으며 금화와 위신 비용이 전액 반환되었다.\n\n임시 작위는 해체되고 이번 원정을 위해 복종했던 통치자들은 해방된다. 그들의 다른 전쟁은 그대로 계속된다."
 title_domination.0007.ok:0 "이번 원정을 다시 생각해야겠다."
 td_oath_current_war_desc:0 "\n\n나는 이미 다른 전쟁에서 패권 통치자와 싸우고 있다. 그 분쟁이 계속되는 동안 그와 두 번째 공동 전쟁에 참여하거나 충성을 맹세할 수 없다. 중립을 지켜도 기존 전쟁은 변하지 않는다."
 td_oath_current_war_tt:0 "다른 전쟁에서 이미 패권 통치자의 적인 동안에는 충성을 맹세할 수 없습니다. 이 결정은 기존 전쟁을 끝내지 않습니다."
 td_fight_military_available_tt:0 "아직 유효한 답변이어야 합니다. 현재 전쟁 관계가 이미 저항을 선택한 모든 통치자와 함께 패권 통치자 및 승인된 모든 지원자에게 맞서는 것을 허용해야 합니다."
 td_join_military_available_tt:0 "아직 유효한 답변이어야 합니다. 현재 전쟁 관계가 패권 통치자 및 승인된 모든 지원자와 함께 이미 저항을 선택한 모든 통치자에게 맞서는 것을 허용해야 합니다."
 td_religion_grant_available_tt:0 "요청이 아직 유효하고 종교적 보호를 받을 자격이 있어야 합니다. 요청한 통치자의 전쟁 관계가 여전히 공동 전쟁에서 당신 편에 가담하는 것을 허용해야 합니다."
 td_legacy_campaign_title:0 "이전 원정"
 td_legacy_campaign_desc:0 "이전의 대기 및 지연 지원 규칙은 더 이상 사용되지 않습니다. 그 규칙에 따른 미완료 시도는 취소되고 준비 비용이 반환되며, 임시 작위가 해체되고 복종한 통치자들은 해방됩니다. 기존 전쟁은 변하지 않습니다."
 td_legacy_campaign_close:0 "알겠다."
 td_oath_rejected_desc:0 "\n\n충성 맹세가 성립되지 않았다. 이제 가능하다면 저항하거나 중립을 지킬 수 있다."
 td_fc_header_tt:0 "#T 가장 가능성 높은 답변을 기준으로 한 예측#!"
 td_fc_own_tt:0 "#high 당신의 봉역:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] (예상 아군 병력의 [SCOPE.ScriptValue('td_fc_own_share_value')|%0])."
 td_fc_support_header_tt:0 "#P 예상 지원:#! 통치자 [SCOPE.ScriptValue('td_fc_support_count_value')|0]명, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N 예상 저항:#! 통치자 [SCOPE.ScriptValue('td_fc_fighters_count_value')|0]명, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high 예상 중립:#! 통치자 [SCOPE.ScriptValue('td_fc_neutral_count_value')|0]명, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning 조건부 지원:#! 통치자 [SCOPE.ScriptValue('td_fc_conditional_count_value')|0]명 / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0]이 종교적 보호를 요청할 것으로 예상됩니다. 이 시나리오는 당신이 이를 승인하고 충성 맹세가 성립한다고 가정합니다."
 td_fc_ratio_tt:0 "#high 예상 병력:#! 아군 [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0], 저항 측 [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "병력 비율을 계산하지 않습니다. 예상 저항 측 병력은 [soldier_i] 0명입니다."
 td_fc_caveat_tt:0 "#weak 현재 상태의 예측으로, 통치자마다 가중치가 가장 높은 답변 하나를 택하며 각 진영의 수학적 기댓값은 아닙니다. 확률은 AI 가중치를 따르며 플레이어와 이전 답변이 결과를 바꿀 수 있습니다. 현재 병력에는 외부 동맹이나 향후 모집이 포함되지 않으며 승률을 나타내지 않습니다. 지원자의 비중은 아군 전체를, 다른 비중은 해당 집단을 기준으로 합니다.#!"
 td_diplomacy_begin_tt:0 "#warning 실제로 전쟁이 일어나야 협정 위반이 성립합니다.#! 공격한 동맹마다 동맹 파기, 위신 −250, 명예 단계 −1이 적용됩니다. 자신을 구속하는 휴전을 깰 때마다 위신 −250, 명예 단계 −1 및 등급에 따른 정통성 손실이 적용됩니다. 또한 3년 동안 의견 변화가 적용됩니다. 동맹 공격은 −25, 휴전 파기는 −50이며 종류별로 한 번씩 적용됩니다. 자원 손실은 상대마다 누적되며 특성 혜택과 특별 면제는 유지됩니다. 방어자, 중립자 및 전쟁 없는 원정에는 불이익이 없습니다."
 td_diplomacy_join_tt:0 "#warning 공격 측에 가담합니다.#! 방어자들과 맺은 자신의 동맹이나 휴전 때문에 상대마다 같은 위신, 명예 및 휴전 관련 정통성 손실과 의견 변화가 발생할 수 있습니다. 종교적 보호가 이를 면제하지는 않습니다. 전쟁이 없으면 불이익도 없습니다."
 td_diplomacy_defend_tt:0 "패권 통치자에 맞서 방어한다고 해서 동맹이나 휴전을 깬 사람이 되지는 않습니다. 공격 측이 자신이 위반한 협정에 책임을 집니다."
 td_fc_support_rest_tt:0 "그 밖의 통치자 [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0]명: [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
 td_fc_support_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_1_strength_value')|0]; 비중 [SCOPE.ScriptValue('td_fc_support_1_share_value')|%0]; 답변 확률 [SCOPE.ScriptValue('td_fc_support_1_probability_value')|%0]."
 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning 신앙 보호.#!"
 td_fc_support_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_2_strength_value')|0]; 비중 [SCOPE.ScriptValue('td_fc_support_2_share_value')|%0]; 답변 확률 [SCOPE.ScriptValue('td_fc_support_2_probability_value')|%0]."
 td_fc_support_row_2_conditional_tt:0 "$td_fc_support_row_2_tt$ #warning 신앙 보호.#!"
 td_fc_support_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_3_strength_value')|0]; 비중 [SCOPE.ScriptValue('td_fc_support_3_share_value')|%0]; 답변 확률 [SCOPE.ScriptValue('td_fc_support_3_probability_value')|%0]."
 td_fc_support_row_3_conditional_tt:0 "$td_fc_support_row_3_tt$ #warning 신앙 보호.#!"
 td_fc_support_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_4_strength_value')|0]; 비중 [SCOPE.ScriptValue('td_fc_support_4_share_value')|%0]; 답변 확률 [SCOPE.ScriptValue('td_fc_support_4_probability_value')|%0]."
 td_fc_support_row_4_conditional_tt:0 "$td_fc_support_row_4_tt$ #warning 신앙 보호.#!"
 td_fc_support_row_5_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_5.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_5_strength_value')|0]; 비중 [SCOPE.ScriptValue('td_fc_support_5_share_value')|%0]; 답변 확률 [SCOPE.ScriptValue('td_fc_support_5_probability_value')|%0]."
 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning 신앙 보호.#!"
 td_fc_fighters_rest_tt:0 "그 밖의 통치자 [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0]명: [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
