# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T 내 협정의 보호를 받는 영주#!"

 td_dp_start_desc:0 "\n\n내 협정의 보호를 받는 규범 권역 영주는 [TopScope.GetValue('td_dp_count')|0]명입니다. 이들은 중립을 지키거나 작위 등급에 따라 충성을 맹세할 수 있습니다. 기존 협정이 존중되므로 이로 인해 명예 단계를 잃지 않습니다."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — 동맹"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — 나에게 휴전 의무가 있음"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — 이 영주에게 휴전 의무가 있음"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "인정에서 복종으로"
 title_domination.0100.desc:0 "이제 [td_target.GetName] 작위는 내 것이다. 여기서 원정을 끝낼 수도 있고, 앞서 중립을 지켰던 이들을 포함한 나머지 규범 권역 영주들에게 복종을 요구할 수도 있다. 이들은 저항하거나 충성을 맹세할 수 있다. 협정의 보호를 받는다면 중립을 지켜도 된다."
 title_domination.0100.start:0 "남은 통치자들에게 복종을 요구한다."
 title_domination.0100.finish:0 "작위를 확보하고 원정을 끝낸다."
 td_subjugation_cb:0 "규범 권역 복속"
 td_subjugation_war:0 "규범 권역 복속 전쟁"
 td_subjugation_victory:0 "규범 권역 복속 완료"
 td_subjugation_defeat:0 "복속 시도 격퇴"
 td_subjugation_start_tt:0 "준비 비용은 이미 지불했습니다. 강한 영주부터 답하며 충성을 맹세할 때 종교 보호를 요청할 수 있습니다. 저항을 택한 통치자와만 싸웁니다. 승리하면 봉신으로 삼을 수 있는 낮은 등급의 통치자가 모든 영지를 그대로 거느리고 당신의 봉신이 됩니다. 다른 방어자는 분쟁 중인 규범 권역의 영지만 넘깁니다. 패배해도 확보한 작위와 자발적으로 복종한 봉신은 유지합니다."
 td_subjugation_finish_tt:0 "확보한 작위와 자발적 봉신을 유지하고 원정을 끝냅니다. 첫 전쟁에서 저항했고 여전히 봉역 밖에 있는 통치자들과 일방적 휴전이 성립합니다. 기존 휴전이 더 길면 그 기간이 유지됩니다. 두 번째 전쟁은 없습니다."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — 당신의 봉역 밖에 규범 권역의 땅을 지닌 잠재적 응답자."

 td_subjugation_compatible_tt:0 "제안이 여전히 유효해야 하며 지배를 요구하는 통치자는 독립 상태이고 평화로워야 한다. 각 응답과 시작할 전쟁은 선택한 방식과 현재의 군사 상황에 맞는지 확인한다."
 td_subjugation_truce_name:0 "패권 원정이 종료되었다"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName](이)가 [td_target.GetName] 작위를 확보하고 내게 복종을 요구한다. 저항할 수도 있고, 작위 등급이 허락한다면 충성을 맹세할 수도 있다. 가능하다면 종교 보호도 청할 수 있다. 상대 영주나 이미 충성을 맹세한 영주와 협정을 맺었다면 중립을 지키고 내 영지를 보전할 수 있다."
 td_subjugation_fight_tt:0 "복속 요구에 무력으로 저항한다. 패배한 독립 통치자의 작위 등급이 승자보다 낮으면 승자의 봉신이 되며, 분쟁 중인 작위의 경계 밖을 포함해 기존 작위와 영지, 휘하 봉신을 그대로 유지한다. 봉신으로 삼을 수 없는 경우에는 분쟁 중인 규범 권역의 영지만 강화 조건에 포함된다. 공격에 실패해도 공격자는 확보한 작위와 자발적으로 복종한 봉신을 유지한다. 이 전쟁에서는 배상금을 지불하지 않는다."
 td_subjugation_join_tt:0 "봉신이 되며, 주군이 이 단계에서 패배해도 봉신으로 남습니다."
 title_domination.0002.unavailable:0 "참여할 수 없다."
 td_subjugation_response_blocked_tt:0 "현재 군사 상황에서는 두 번째 단계에 가능한 응답이 없다. 복속 시도는 취소되지만 확보한 작위와 자발적인 모든 충성 서약은 유지된다. 다른 전쟁을 강제로 끝내지 않는다."
 title_domination.0101.t:0 "복속을 시작할 수 없었다"
 title_domination.0101.desc:0 "군사 상황이 바뀌어 복속을 시작할 수 없었다. 확보한 작위와 자발적으로 복종한 모든 통치자는 지배를 요구하는 통치자의 권위 아래 남는다. 추가 준비 비용 없이 원정이 끝났다."
 title_domination.0101.ok:0 "알겠다."
 rule_td_subjugation_war_mode:0 "Title Domination: 복속 전쟁"
 setting_td_subjugation_coalition:0 "공동 연합"
 setting_td_subjugation_coalition_desc:0 "두 번째 단계에서는 저항하는 모든 통치자가 한 전쟁에서 함께 방어하며 같은 결과를 맞는다. 첫 번째 단계는 바뀌지 않는다."
 setting_td_subjugation_individual:0 "개별 전쟁"
 setting_td_subjugation_individual_desc:0 "두 번째 단계에서는 저항하는 통치자마다 별도의 전쟁을 벌이며 각 전쟁이 따로 끝난다. 한 전쟁이 끝나도 다른 전쟁은 계속된다. 첫 번째 단계는 바뀌지 않는다."
 td_subjugation_individual_cb:0 "개별 규범 권역 복속"
 td_subjugation_individual_war:0 "개별 규범 권역 복속 전쟁 — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "규범 권역 복속 완료"
 td_subjugation_individual_defeat:0 "개별 복속 시도 격퇴"
 td_subjugation_mode_coalition_tt:0 "#bold 공동 연합:#! 두 번째 단계에서 저항하는 모든 통치자가 한 전쟁에서 방어하며 같은 결과를 맞는다."
 td_subjugation_mode_individual_tt:0 "#bold 개별 전쟁:#! 두 번째 단계에서는 저항하는 통치자마다 따로 전쟁을 벌인다. 승리하거나 패배해도 해당 상대와의 전쟁만 끝나며 다른 전쟁은 계속된다. 패배해도 확보한 작위와 모든 자발적 봉신을 유지하며, 해당 전쟁의 주 방어자에게만 휴전이 적용된다."
