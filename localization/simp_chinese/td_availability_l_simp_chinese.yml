 setting_td_ai_frequent:0 "频繁"
 setting_td_ai_frequent_desc:0 "每季度，符合条件的AI统治者有25%的概率考察附近的头衔。他们可用尽现有预算，即便相较潜在敌军稍处下风也会发动战役。"
