 setting_td_ai_rare:0 "罕见"
 setting_td_ai_rare_desc:0 "AI统治者每年有较小概率考虑一个附近的头衔。只有储备充足且军力占压倒性优势时才会发动战役。"
 setting_td_ai_medium:0 "适中"
