l_simp_chinese:
 rule_td_domination_territory:0 "头衔支配：可选头衔"
 setting_td_territory_all:0 "所有头衔"
 setting_td_territory_all_desc:0 "可以对地图上任何尚未创建的头衔宣告支配。"
 setting_td_territory_realm:0 "领地内拥有法理伯爵领"
 setting_td_territory_realm_desc:0 "你的领地必须至少包含目标头衔的一个法理伯爵领，封臣持有的伯爵领也计算在内。"
 setting_td_territory_capital:0 "首都所属的法理头衔"
 setting_td_territory_capital_desc:0 "你的领地首都所在的伯爵领必须属于目标头衔的法理范围。"
 td_discover_domination_decision:0 "你可以宣告支配"
 td_discover_domination_desc:0 "选择一个尚未创建且你负担得起远征开销的头衔。你可以在头衔窗口中查看筹备费用和远征条件，再决定是否发起远征。"
 td_discover_domination_tooltip:0 "查看可以宣告支配的头衔。"
 td_discover_domination_confirm:0 "打开头衔"
 rule_td_ai_frequency:0 "Title Domination：AI宣告支配的频率"
 setting_td_ai_off:0 "关闭"
