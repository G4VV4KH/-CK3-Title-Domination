 td_fc_fighters_rest_tt:0 "另有[SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0]位统治者：[soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]。"
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; 占比 [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; 答复概率 [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
