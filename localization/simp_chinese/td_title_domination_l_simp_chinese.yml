 td_fc_unavailable_tt:0 "此旧版预览没有预测。请关闭预览并重新打开头衔行动，以生成新的快照。"
 td_settlement_truce_tt:0 "单向[truce|E]：[attacker.GetShortUIName|U] → [defender.GetShortUIName]，至少#V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#!天。若已有更长的停战协议，则保留其期限。"
