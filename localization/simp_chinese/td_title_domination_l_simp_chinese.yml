l_simp_chinese:
 td_title_button:0 "称霸"
 td_title_button_tt:0 "在宣称此头衔并发起称霸战争前，查看其法理统治者。显示的金钱和威望会在开始时扣除。\n\n你必须处于和平状态，并拥有足够的两种资源。正在进行的称霸行动或尚未结束的冷却期也会阻止此行动。\n\n"
 td_cooldown_available_tt:0 "距离下次称霸行动还有：[GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "称霸[td_target.GetName]"
 title_domination.0001.desc:0 "[td_target.GetName]目前没有持有者。我可以宣称这个头衔，并要求其法理领土上的统治者承认我的权威。他们可以抵抗、保持中立，或在等级允许时向我宣誓效忠。\n\n此次行动花费[gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#!与[prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!。费用取决于头衔等级、所属领土以及这些领土与我领国的距离。\n\n胜利将巩固我的头衔。失败则会销毁头衔，让加入我的法理统治者重获独立，并要求我向抵抗者支付赔款。"
 title_domination.0001.begin:0 "开始扩张。"
 title_domination.0001.cancel:0 "放弃扩张。"
 title_domination.0002.t:0 "称霸之请"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName]已宣称[td_target.GetName]，并要求其法理统治者承认权威。收到全部答复后，将针对选择抵抗者发起一场共同战争。\n\n我可以抵抗、保持中立，或在等级允许时宣誓效忠。不同信仰可能使我有资格请求宗教保护。如果我当前的战争与称霸者或已经选定阵营的参与者冲突，军事选项将不可用。无关的战争不会阻止答复。\n\n统治者依次答复，每次先询问剩余军力最强者。宗教谈判结束后才会询问下一位统治者。所有答复在同一天立即依次进行；单人游戏中，玩家选择时会由通常的事件暂停机制停止时间。"
 title_domination.0002.fight:0 "我将抵抗称霸者。"
 title_domination.0002.ignore:0 "这场争斗与我无关。"
 title_domination.0002.join:0 "我将宣誓效忠并参战。"
 title_domination.0002.religion:0 "保护我的信仰，我便宣誓效忠。"
 title_domination.0003.t:0 "请求宗教保护"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName]信奉另一种信仰，愿意承认我对[td_target.GetName]的权威，成为我的封臣并加入我的战争。作为交换，封臣契约必须保障其宗教权利。\n\n若我拒绝，对方将再次选择抵抗、保持中立，或在没有这项保护的情况下臣服。"
 title_domination.0003.grant:0 "这一信仰将受到保护。"
 title_domination.0003.refuse:0 "我不会给予这种保护。"
 title_domination.0004.t:0 "宗教保护遭拒"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName]拒绝了我的宗教保护请求。我必须决定是战斗、保持中立，还是在没有这一保障的情况下宣誓效忠。"
 title_domination.0004.ok:0 "那么，我必须重新选择。"
 title_domination.0010.t:0 "[td_target.GetName]的命运"
 title_domination.0010.victory_desc:0 "称霸之争已经结束。我对[td_target.GetName]的权威已获巩固，头衔仍归我所有。"
 title_domination.0010.defeat_desc:0 "我称霸[td_target.GetName]的行动失败了。宣称的头衔被销毁，加入此次行动的法理统治者恢复独立，而抵抗者将获得赔款。"
 title_domination.0010.ok:0 "此事已定。"
 td_domination_cb:0 "头衔称霸"
 td_domination_war:0 "头衔称霸战争"
 td_domination_victory:0 "霸权确立"
 td_domination_defeat:0 "称霸失败"
 td_preview_defenders_tt:0 "此次行动中被要求答复的法理统治者："
 td_start_tt:0 "支付费用并宣称头衔。统治者在同一天按军力由强到弱答复；全部答复后才会开战。开始时会触发十年冷却期：胜利、无人抵抗或因技术原因取消并退款都会清除冷却；失败则保留剩余时间。"
 td_join_tt:0 "你成为称霸者的封臣，并在共同战争开始时加入其阵营。如果称霸者输掉此次行动，你将恢复独立。此选择必须与所有已选定阵营的参与者相容。"
 td_religion_tt:0 "请求在封臣契约中获得宗教保护。若获准，你将成为封臣并加入称霸者一方。若遭拒，你将重新选择，且不能再次提出此请求。"
 td_neutral_tt:0 "你不参与战争，并保留领土与现有政治地位。你不会分得任何赔款。"
 td_fight_tt:0 "其他答复到齐后，你将加入共同对抗称霸者的战争。如果称霸行动失败，你将获得一份赔款。"
 td_victory_tt:0 "称霸者保留宣称的头衔。"
 td_defeat_tt:0 "宣称的头衔被销毁。加入称霸者的法理统治者恢复独立，赔款由抵抗者瓜分。"
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "联军未能集结"
 title_domination.0007.desc:0 "收到答复后，军事局势发生了变化，或承诺参战者无法加入同一场战争。不会默默排除任何已接受的参与者。对[td_target.GetName]的称霸行动已取消，全部金钱和威望费用已退还。\n\n临时头衔被解散，为此次行动臣服的统治者获得自由。他们的其他战争照常继续。"
 title_domination.0007.ok:0 "我必须重新考虑此次行动。"
 td_oath_current_war_desc:0 "\n\n我已在另一场战争中与称霸者交战。在该冲突结束前，我无法与其参与第二场共同战争，也无法向其宣誓效忠。保持中立不会改变我们现有的战争。"
 td_oath_current_war_tt:0 "当你已在另一场战争中与称霸者为敌时，无法向其宣誓效忠。此决定不会结束现有战争。"
 td_fight_military_available_tt:0 "此答复必须仍然有效。你的战争关系必须允许你与所有已选择抵抗的统治者一起，对抗称霸者及全部已接受的志愿支持者。"
 td_join_military_available_tt:0 "此答复必须仍然有效。你的战争关系必须允许你加入称霸者及全部已接受的志愿支持者，共同对抗所有已选择抵抗的统治者。"
 td_religion_grant_available_tt:0 "请求必须仍然有效且符合宗教保护资格。请求者的战争关系必须仍然允许其加入共同战争中的你方阵营。"
 td_legacy_campaign_title:0 "先前的行动"
 td_legacy_campaign_desc:0 "旧版的等待与延后支援规则已不再使用。依照旧规则尚未完成的行动将被取消，准备费用退还，临时头衔解散，为此臣服的统治者获得自由。现有战争不受影响。"
 td_legacy_campaign_close:0 "明白了。"
 td_oath_rejected_desc:0 "\n\n效忠誓言未能确立。我现在可以在选项允许时抵抗，或保持中立。"
 td_fc_header_tt:0 "#T 按最可能答复作出的预测#!"
 td_fc_own_tt:0 "#high 你的领国：#![soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0]（占预计己方军力的[SCOPE.ScriptValue('td_fc_own_share_value')|%0]）。"
 td_fc_support_header_tt:0 "#P 预计支持：#![SCOPE.ScriptValue('td_fc_support_count_value')|0]位统治者，[soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]。"
 td_fc_fighters_header_tt:0 "#N 预计抵抗：#![SCOPE.ScriptValue('td_fc_fighters_count_value')|0]位统治者，[soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]。"
 td_fc_neutral_header_tt:0 "#high 预计中立：#![SCOPE.ScriptValue('td_fc_neutral_count_value')|0]位统治者，[soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]。"
 td_fc_conditional_tt:0 "#warning 有条件的支持：#!预计有[SCOPE.ScriptValue('td_fc_conditional_count_value')|0]位统治者／[soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0]会请求宗教保护。此情景假定你同意保护，且其效忠成功。"
 td_fc_ratio_tt:0 "#high 预计兵力：#!你方[soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0]，抵抗方[SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]（[SCOPE.ScriptValue('td_fc_ratio_value')|2]:1）。"
 td_fc_no_fighters_tt:0 "不计算兵力比：预计抵抗方拥有[soldier_i] 0名士兵。"
 td_fc_caveat_tt:0 "#weak 当前快照：每位统治者只取权重最高的单个答复，并非各阵营的数学期望。概率基于AI权重；玩家和先前答复都可能改变结果。现有兵力不含外部盟友与未来征募，也不代表胜率。支持者占比以你方总兵力为分母，其他占比以各自组别为分母。#!"
 td_diplomacy_begin_tt:0 "#warning 只有真正开战才会违反协议。#!每攻击一位盟友：解除同盟、−250威望、−1级名望。每违反一项约束你的停战协议：−250威望、−1级名望，并按等级损失正统性。此外，还会获得持续三年的好感修正：攻击盟友−25，违反停战协议−50，每种修正各应用一次。资源损失按对手累计；相关技能与特殊豁免仍然适用。防守者、中立者以及未开战的行动均不受处罚。"
 td_diplomacy_join_tt:0 "#warning 你加入进攻方。#!你与防守者之间的同盟及约束你的停战协议，可能使你按每位对手承受相同的威望、名望损失，以及违反停战协议导致的正统性损失和好感修正。宗教保护不能免除这些处罚；未开战则没有处罚。"
 td_diplomacy_defend_tt:0 "抵御称霸者不会使你成为同盟或停战协议的违约者。进攻方须为自己违反的协议负责。"
 td_fc_support_rest_tt:0 "另有[SCOPE.ScriptValue('td_fc_support_rest_count_value')|0]位统治者：[soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]。"
 td_fc_support_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_1_strength_value')|0]; 占比 [SCOPE.ScriptValue('td_fc_support_1_share_value')|%0]; 答复概率 [SCOPE.ScriptValue('td_fc_support_1_probability_value')|%0]."
 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning 信仰保护。#!"
