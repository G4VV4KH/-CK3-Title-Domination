l_japanese:
 rule_td_domination_territory:0 "称号支配：対象となる称号"
 setting_td_territory_all:0 "すべての称号"
 setting_td_territory_all_desc:0 "地図上のどこにあっても、未創設の称号に対して支配を宣言できます。"
 setting_td_territory_realm:0 "領国内に伯爵領がある称号"
 setting_td_territory_realm_desc:0 "対象称号の慣習的領土に属する伯爵領が、自領内に少なくとも一つ必要です。封臣が保有する伯爵領も含まれます。"
 setting_td_territory_capital:0 "首都を含む称号"
 setting_td_territory_capital_desc:0 "領国の首都が置かれた伯爵領が、対象称号の慣習的領土に含まれている必要があります。"
 td_discover_domination_decision:0 "支配を宣言できます"
 td_discover_domination_desc:0 "遠征費用を賄える未創設の称号を選んでください。称号画面で準備費用と遠征条件を確認してから、開始するかどうかを決められます。"
 td_discover_domination_tooltip:0 "支配を宣言できる称号を表示します。"
 td_discover_domination_confirm:0 "称号を開く"
 rule_td_ai_frequency:0 "Title Domination：AIの称号支配の頻度"
 setting_td_ai_off:0 "無効"
 setting_td_ai_off_desc:0 "AIの統治者は支配要求に応じることはありますが、自ら称号の支配を宣言することはありません。"
 setting_td_ai_rare:0 "低頻度"
 setting_td_ai_rare_desc:0 "AIの統治者は毎年、低い確率で近隣の称号を一つ検討します。十分な蓄えと圧倒的な軍事力がある場合に遠征を始めます。"
 setting_td_ai_medium:0 "中頻度"
 setting_td_ai_medium_desc:0 "AIの統治者は毎年、近隣の称号を検討することがあります。予備の資源を残し、予想される敵より優位に立てる目標を選びます。"
 setting_td_ai_frequent:0 "高頻度"
 setting_td_ai_frequent_desc:0 "条件を満たすAIの統治者は、3か月ごとに25%の確率で近隣の称号を検討します。利用可能な予算をすべて投じることができ、予想される敵がやや優勢でも遠征を始めます。"
