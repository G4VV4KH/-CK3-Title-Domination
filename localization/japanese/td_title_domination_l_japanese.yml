 td_fc_neutral_rest_tt:0 "ほかの統治者[SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0]人：[soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]。"
