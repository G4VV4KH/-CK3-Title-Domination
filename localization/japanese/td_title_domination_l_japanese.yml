 td_fc_unavailable_tt:0 "この古いプレビューでは予測を利用できません。閉じてから称号の行動を開き直すと、新たな予測を確認できます。"
 td_settlement_truce_tt:0 "一方的な[truce|E]：[attacker.GetShortUIName|U] → [defender.GetShortUIName]、最低#V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#!日間。既存の停戦の方が長い場合、その期限が維持されます。"

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T あなたの協定で保護される統治者#!"

 td_dp_start_desc:0 "\n\nあなたの協定で保護される慣習的領土の統治者は[TopScope.GetValue('td_dp_count')|0]人です。中立を保つか、爵位が許せば臣従を誓えます。 現在の協定は守られ、これによって名声を失うことはありません。"
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — 同盟"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — あなたを拘束する停戦協定"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — この統治者を拘束する停戦協定"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "承認から服従へ"
 title_domination.0100.desc:0 "[td_target.GetName]の称号は我がものとなった。ここで遠征を終えてもよいし、先ほど中立を守った者も含め、残りの慣習的領土の統治者に臣従を求めてもよい。彼らは抵抗するか臣従を誓うことができ、協定で守られる者は中立を保てる。"
 title_domination.0100.start:0 "残る統治者に服従を要求する。"
 title_domination.0100.finish:0 "称号を確保し、遠征を終える。"
 td_subjugation_cb:0 "慣習的領土の征服"
 td_subjugation_war:0 "慣習的領土の征服戦争"
 td_subjugation_victory:0 "慣習的領土を征服"
 td_subjugation_defeat:0 "征服を撃退"
 td_subjugation_start_tt:0 "準備費用は支払い済みです。兵力の多い統治者から順に返答し、臣従を選ぶ者は信仰の保護を求められます。抵抗を選んだ相手とだけ戦います。勝てば、封臣にできる下位の統治者は全領地を保持したままあなたの封臣になります。それ以外の守備側が引き渡すのは係争中の慣習的領地だけです。敗れても確保した称号と自ら臣従した封臣は残ります。"
 td_subjugation_finish_tt:0 "確保した称号と自発的な臣下を維持し、遠征を終了します。最初の戦争で抵抗し、今も領国外にいる統治者との一方向の停戦が成立します。既存の停戦の方が長ければ、その期間が維持されます。二度目の戦争は起きません。"
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — あなたの領国外に慣習的領土を持ち、再回答を求められうる統治者。"

 td_subjugation_compatible_tt:0 "この提案が現在も有効で、支配を求める統治者が独立し、平和な状態にある必要がある。各返答と開始する戦争は、選択された方式と現在の軍事情勢に照らして確認される。"
 td_subjugation_truce_name:0 "覇権を巡る遠征は終了した"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName]は[td_target.GetName]の称号を確保し、私にも臣従を求めている。私は抵抗するか、爵位が許せば臣従を誓うことができる。条件を満たせば信仰の保護も求められる。相手またはすでに臣従を誓った統治者と協定を結んでいれば、中立を守り領地を維持できる。"
 td_subjugation_fight_tt:0 "服属の要求に武力で抵抗する。敗れた独立統治者の爵位が勝者より低ければ、その封臣となる。係争中の称号の領域外も含め、称号、所領、配下の封臣はすべて保持する。封臣にできない場合、講和の対象は係争中の慣習的領地に限られる。攻撃側が敗れても、確保した称号と自ら臣従した封臣は失われない。この戦争で賠償金は発生しない。"
 td_subjugation_join_tt:0 "あなたは封臣となります。この段階で主君が敗れても、封臣のままです。"
 title_domination.0002.unavailable:0 "参加することはできない。"
 td_subjugation_response_blocked_tt:0 "現在の軍事情勢では、この第二段階で可能な返答がない。服属の試みは中止されるが、確保した称号と自発的な臣従はすべて維持される。他の戦争を強制的に終わらせることはない。"
 title_domination.0101.t:0 "服属を始められなかった"
 title_domination.0101.desc:0 "軍事情勢が変わり、服属要求の実行を開始できなかった。確保した称号と自ら服従したすべての統治者は、支配を求める統治者のもとに残る。追加の準備費用を払うことなく遠征は終了した。"
 title_domination.0101.ok:0 "承知した。"
 rule_td_subjugation_war_mode:0 "Title Domination：服属戦争"
 setting_td_subjugation_coalition:0 "共同連合"
 setting_td_subjugation_coalition_desc:0 "第二段階ではすべての抵抗者が一つの戦争で共同防衛し、同じ結果を受ける。第一段階は変わらない。"
 setting_td_subjugation_individual:0 "個別の戦争"
 setting_td_subjugation_individual_desc:0 "第二段階では各抵抗者と別々に戦い、各戦争が個別に決着する。一つの戦争が終わっても、ほかの戦争は続く。第一段階は変わらない。"
 td_subjugation_individual_cb:0 "個別の慣習的領土服属"
 td_subjugation_individual_war:0 "個別の慣習的領土服属戦争 — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "慣習的領土の服属"
 td_subjugation_individual_defeat:0 "個別の服属要求を撃退"
 td_subjugation_mode_coalition_tt:0 "#bold 共同連合：#! 第二段階のすべての抵抗者が一つの戦争で防衛し、同じ結果を受ける。"
 td_subjugation_mode_individual_tt:0 "#bold 個別の戦争：#! 第二段階では各抵抗者と別々に戦う。勝利や敗北で終わるのはその相手との戦争だけで、ほかの戦争は続く。敗北しても確保した称号とすべての自発的な封臣は残り、停戦が成立するのはその戦争の主要防衛者との間だけとなる。"
