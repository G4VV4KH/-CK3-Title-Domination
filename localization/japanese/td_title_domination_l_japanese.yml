l_japanese:
 td_title_button:0 "覇権"
 td_title_button_tt:0 "この称号を宣言して覇権戦争を始める前に、慣習的領土の統治者を確認します。表示された金と威信は開始時に支払います。\n\n平時であり、両方の資源が十分に必要です。進行中の覇権獲得の試みや、終了していない待機期間がある場合も、この行動は実行できません。\n\n"
 td_cooldown_available_tt:0 "次の覇権獲得の試みまで：[GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "[td_target.GetName]に対する覇権"
 title_domination.0001.desc:0 "[td_target.GetName]には保有者がいない。私はこの称号を宣言し、慣習的領土の統治者に権威の承認を要求できる。彼らは抵抗するか、中立を保つか、階級が許すなら忠誠を誓うこともできる。\n\nこの遠征には[gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#!と[prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!がかかる。費用は称号の階級、領土、そしてその領土と我が領国との距離によって決まる。\n\n最初の勝利で称号が確定し、残りの慣習的領土を巡る別の戦争が提案されます。最初の戦争で敗北すると称号は破棄され、参加した慣習的領土の統治者は独立を取り戻し、抵抗した者に賠償を支払います。二度目の戦争で敗北しても最初の成功は取り消されません。勝利では停戦は結ばれず、敗北した場合や最初の勝利後に遠征を終えた場合に停戦が成立します。"
 title_domination.0001.begin:0 "拡張を開始する。"
 title_domination.0001.cancel:0 "拡張を断念する。"
 title_domination.0002.t:0 "覇権の主張"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName]が[td_target.GetName]を宣言し、慣習的領土の統治者に承認を要求している。全員の返答が届いた後、抵抗を選んだ者たちに対する一つの共同戦争が始まる。\n\n私は抵抗するか、中立を保つか、階級が許すなら忠誠を誓うこともできる。信仰が異なれば宗教的保護を求められる場合がある。現在の戦争が覇権を求める統治者や、すでに陣営を選んだ者と両立しない場合、軍事的な選択はできない。無関係な戦争は返答を妨げない。\n\n統治者は残る軍勢が最も強い者から一人ずつ返答する。宗教交渉は次の統治者に話を持ちかける前に終える。返答は同じ日に即座に続き、シングルプレイではプレイヤーが選択する間、通常のイベント一時停止によって時間が止まる。"
 title_domination.0002.fight:0 "覇権を求める統治者と戦う。"
 title_domination.0002.ignore:0 "この争いは私のものではない。"
 title_domination.0002.join:0 "臣従を誓おう。"
 title_domination.0002.religion:0 "我が信仰を守るなら、忠誠を誓おう。"
 title_domination.0003.t:0 "宗教的保護の要請"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName]は信仰の保護と引き換えに、[td_target.GetName]に対する私の権威を認め、臣従を誓うと申し出た。断れば、この統治者は別の返答を選べる。"
 title_domination.0003.grant:0 "その信仰は保護される。"
 title_domination.0003.refuse:0 "そのような保護は与えない。"
 title_domination.0004.t:0 "宗教的保護の拒否"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName]は信教の保護要求を拒否した。この保証なしで、可能な返答から選び直さなければならない。"
 title_domination.0004.ok:0 "では、もう一度選ばねば。"
 title_domination.0010.t:0 "[td_target.GetName]の運命"
 title_domination.0010.victory_desc:0 "[td_target.GetName]に対する私の権威は確立され、称号は私の手に残る。残りの慣習的領土を巡る次の戦争は別の選択であり、そこで失敗してもこの成功は取り消されない。"
 title_domination.0010.defeat_desc:0 "[td_target.GetName]への覇権獲得は失敗した。宣言した称号は破棄され、この遠征に加わった慣習的領土の統治者は独立を取り戻し、抵抗した者たちには賠償金が支払われる。"
 title_domination.0010.ok:0 "決着はついた。"
 td_domination_cb:0 "称号の覇権"
 td_domination_war:0 "称号の覇権戦争"
 td_domination_victory:0 "覇権の確立"
 td_domination_defeat:0 "覇権の敗北"
 td_preview_defenders_tt:0 "この遠征で返答を求められる慣習的領土の統治者："
 td_start_tt:0 "費用を払い、称号を宣言します。統治者は同じ日に強い者から返答し、全員の返答後に戦争が始まります。最初の成功で称号が確定し、残りの慣習的領土を巡る別の戦争へ進めます。開始時に10年の待機期間が発生します。最初の勝利、抵抗のない称号獲得、または費用が返還される技術的な中止で解除され、最初の戦争での敗北では残り期間が維持されます。"
 td_join_tt:0 "臣従を誓います。主君が最初の戦争に敗れれば、再び独立します。"
 td_religion_tt:0 "臣従の条件として信仰の保護を求めます。拒否されれば別の返答を選べます。"
 td_neutral_tt:0 "戦争には参加せず、領土と現在の政治的地位を維持します。賠償金の分配は受けられません。"
 td_fight_tt:0 "ほかの返答が届いた後、覇権を求める統治者に対する共同戦争へ加わります。その遠征が失敗すれば、賠償金の一部を受け取ります。"
 td_victory_tt:0 "覇権を求める統治者は宣言した称号を維持します。"
 td_defeat_tt:0 "宣言した称号は破棄されます。その統治者に加わった慣習的領土の統治者は独立を取り戻し、抵抗した者たちに賠償金が分配されます。"
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "連合を結成できず"
 title_domination.0007.desc:0 "返答後に軍事情勢が変化したか、約束した参加者が一つの共同戦争に参加できなかった。承認済みの参加者を黙って除外することはない。[td_target.GetName]への覇権獲得の試みは中止され、金と威信の費用は全額返還された。\n\n仮の称号は解消され、この遠征のために服従した統治者は解放される。彼らのほかの戦争はそのまま続く。"
 title_domination.0007.ok:0 "この遠征を考え直さねば。"
 td_oath_current_war_desc:0 "\n\n私はすでに別の戦争で支配を求める統治者と戦っている。それが続く間は、同じ相手との第二の共同戦争に加わることも、臣従を誓うこともできない。この返答が現在の戦争を終わらせることはない。"
 td_oath_current_war_tt:0 "別の戦争ですでに敵対している間は、覇権を求める統治者に忠誠を誓えません。この決定は既存の戦争を終わらせません。"
 td_fight_military_available_tt:0 "抵抗するには、現在の戦争が選択された戦争方式での交戦を許す必要があります。\n$td_diplomacy_defend_tt$"
 td_join_military_available_tt:0 "現在の戦争が臣従を許している必要があります。どの戦争に加われるかは協定によって決まります。"
 td_religion_grant_available_tt:0 "要請がまだ有効であり、宗教的保護の資格を満たしていなければなりません。要請した統治者の戦争関係が、今も共同戦争であなたの陣営に加わることを許す必要があります。"
 td_legacy_campaign_title:0 "以前の遠征"
 td_legacy_campaign_desc:0 "以前の待機と遅延支援の規則は、もう使用されません。その規則による未完了の試みは中止され、準備費用は返還され、仮の称号は解消され、服従した統治者は解放されます。既存の戦争は変わりません。"
 td_legacy_campaign_close:0 "承知した。"
 td_oath_rejected_desc:0 "\n\n臣従の誓いを成立させられなかった。残る可能な返答から選ばなければならない。"
 td_fc_header_tt:0 "#T 最も可能性の高い返答に基づく予測#!"
 td_fc_own_tt:0 "#high あなたの領国：#![soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0]（予想される自陣営の[SCOPE.ScriptValue('td_fc_own_share_value')|%0]）。"
 td_fc_support_header_tt:0 "#P 予想される支持：#!統治者[SCOPE.ScriptValue('td_fc_support_count_value')|0]人、[soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]。"
 td_fc_fighters_header_tt:0 "#N 予想される抵抗：#!統治者[SCOPE.ScriptValue('td_fc_fighters_count_value')|0]人、[soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]。"
 td_fc_neutral_header_tt:0 "#high 予想される中立：#!統治者[SCOPE.ScriptValue('td_fc_neutral_count_value')|0]人、[soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]。"
 td_fc_conditional_tt:0 "#warning 条件付きの支持：#!統治者[SCOPE.ScriptValue('td_fc_conditional_count_value')|0]人／[soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0]が宗教的保護を求める見込みです。この想定では、あなたが保護を認め、忠誠の誓いが成立するものとします。"
 td_fc_ratio_tt:0 "#high 予想兵力：#!あなた側[soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0]、抵抗側[SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]（[SCOPE.ScriptValue('td_fc_ratio_value')|2]:1）。"
 td_fc_no_fighters_tt:0 "兵力比は計算しません。予想される抵抗側の兵力は[soldier_i] 0人です。"
 td_fc_caveat_tt:0 "#weak 現時点の予測です。各統治者について重みが最大の返答を一つ選んでおり、陣営ごとの数学的期待値ではありません。確率はAIの重みに基づき、プレイヤーや先の返答によって結果は変わり得ます。現在の兵力に外部の同盟者や今後の徴募は含まず、勝率を示すものでもありません。支持者の割合は自陣営全体を、それ以外は各集団を基準にします。#!"
 td_diplomacy_begin_tt:0 "同盟や、いずれか一方を拘束する停戦協定を結んでいる統治者同士は戦いません。協定で保護される統治者は、どちらの段階でも中立を保てます。"
 td_diplomacy_join_tt:0 "協定により参戦できなくても臣従を誓えます。共同戦争では、防衛側に協定で保護された相手が一人でもいれば参戦しません。個別の戦争では、交戦できる相手との戦争だけに加わります。"
 td_diplomacy_defend_tt:0 "支配を宣言した統治者や、すでに臣従を誓った統治者と同盟または停戦協定を結んでいる場合、抵抗できません。"
 td_fc_support_rest_tt:0 "ほかの統治者[SCOPE.ScriptValue('td_fc_support_rest_count_value')|0]人：[soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]。"
 td_fc_support_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_1_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_support_1_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_support_1_probability_value')|%0]."
 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning 信仰の保護。#!"
 td_fc_support_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_2_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_support_2_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_support_2_probability_value')|%0]."
 td_fc_support_row_2_conditional_tt:0 "$td_fc_support_row_2_tt$ #warning 信仰の保護。#!"
 td_fc_support_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_3_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_support_3_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_support_3_probability_value')|%0]."
 td_fc_support_row_3_conditional_tt:0 "$td_fc_support_row_3_tt$ #warning 信仰の保護。#!"
 td_fc_support_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_4_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_support_4_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_support_4_probability_value')|%0]."
 td_fc_support_row_4_conditional_tt:0 "$td_fc_support_row_4_tt$ #warning 信仰の保護。#!"
 td_fc_support_row_5_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_5.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_5_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_support_5_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_support_5_probability_value')|%0]."
 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning 信仰の保護。#!"
 td_fc_fighters_rest_tt:0 "ほかの統治者[SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0]人：[soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]。"
 td_fc_fighters_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_1_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_fighters_1_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_fighters_1_probability_value')|%0]."
 td_fc_fighters_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_2_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_fighters_2_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_fighters_2_probability_value')|%0]."
 td_fc_fighters_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_3_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_fighters_3_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_fighters_3_probability_value')|%0]."
 td_fc_fighters_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_4_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_fighters_4_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_fighters_4_probability_value')|%0]."
 td_fc_fighters_row_5_tt:0 "$EFFECT_LIST_BULLET$[td_fc_fighters_5.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_5_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_fighters_5_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_fighters_5_probability_value')|%0]."
 td_fc_neutral_rest_tt:0 "ほかの統治者[SCOPE.ScriptValue('td_fc_neutral_rest_count_value')|0]人：[soldier_i] [SCOPE.ScriptValue('td_fc_neutral_rest_strength_value')|0]。"
 td_fc_neutral_row_1_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_1.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_1_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_neutral_1_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_neutral_1_probability_value')|%0]."
 td_fc_neutral_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_2_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_neutral_2_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_neutral_2_probability_value')|%0]."
 td_fc_neutral_row_3_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_3.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_3_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_neutral_3_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_neutral_3_probability_value')|%0]."
 td_fc_neutral_row_4_tt:0 "$EFFECT_LIST_BULLET$[td_fc_neutral_4.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_4_strength_value')|0]; 割合 [SCOPE.ScriptValue('td_fc_neutral_4_share_value')|%0]; 返答確率 [SCOPE.ScriptValue('td_fc_neutral_4_probability_value')|%0]."
