 td_fc_unavailable_tt:0 "この古いプレビューでは予測を利用できません。閉じてから称号の行動を開き直すと、新たな予測を確認できます。"
 td_settlement_truce_tt:0 "一方的な[truce|E]：[attacker.GetShortUIName|U] → [defender.GetShortUIName]、最低#V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#!日間。既存の停戦の方が長い場合、その期限が維持されます。"
