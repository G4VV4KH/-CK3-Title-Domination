 td_fc_support_row_1_conditional_tt:0 "$td_fc_support_row_1_tt$ #warning Ochrona wiary.#!"
 td_fc_support_row_2_tt:0 "$EFFECT_LIST_BULLET$[td_fc_support_2.GetName] — [soldier_i] [SCOPE.ScriptValue('td_fc_support_2_strength_value')|0]; udział [SCOPE.ScriptValue('td_fc_support_2_share_value')|%0]; szansa odpowiedzi [SCOPE.ScriptValue('td_fc_support_2_probability_value')|%0]."
 td_fc_support_row_2_conditional_tt:0 "$td_fc_support_row_2_tt$ #warning Ochrona wiary.#!"
