 td_fc_unavailable_tt:0 "Prognoza jest niedostępna w tym starszym podglądzie. Zamknij go i ponownie otwórz akcję tytułu, aby otrzymać aktualny obraz sytuacji."
 td_settlement_truce_tt:0 "Jednostronny [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], co najmniej #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! dni. Dłuższy istniejący rozejm zostaje zachowany."

# Personal diplomatic-risk snapshot shown before the military forecast.
 td_dp_header_tt:0 "#T Władcy chronieni przez twoje umowy#!"

 td_dp_start_desc:0 "\n\nLiczba władców de iure chronionych przez twoje umowy wynosi [TopScope.GetValue('td_dp_count')|0]. Mogą zachować neutralność lub złożyć hołd, jeśli pozwala na to ich ranga. Twoje umowy zostaną dotrzymane bez utraty sławy."
 td_dp_row_alliance_tt:0 "[THIS.Char.GetName] — sojusz"
 td_dp_row_outgoing_tt:0 "[THIS.Char.GetName] — rozejm wiążący ciebie"
 td_dp_row_incoming_tt:0 "[THIS.Char.GetName] — rozejm wiążący tego władcę"

# Optional second war after the title is secured.
 title_domination.0100.t:0 "Od uznania do podporządkowania"
 title_domination.0100.desc:0 "Tytuł [td_target.GetName] należy już do mnie. Mogę zakończyć kampanię lub zażądać hołdu od pozostałych władców de iure, w tym od tych, którzy zachowali neutralność. Mogą stawić opór albo złożyć hołd. Władcy chronieni umową mogą pozostać neutralni."
 title_domination.0100.start:0 "Zażądać poddania od pozostałych władców."
 title_domination.0100.finish:0 "Zakończ wyprawę, zachowując tytuł."
 td_subjugation_cb:0 "Podporządkowanie de iure"
 td_subjugation_war:0 "Wojna o podporządkowanie ziem de iure"
 td_subjugation_victory:0 "Ziemie de iure podporządkowane"
 td_subjugation_defeat:0 "Próba podporządkowania odparta"
 td_subjugation_start_tt:0 "Przygotowania są już opłacone. Najsilniejsi władcy odpowiadają jako pierwsi. Składając przysięgę, można poprosić o ochronę religijną. Wojna obejmuje tylko stawiających opór. Po zwycięstwie władcy niższej rangi, których można zwasalizować, zostaną twoimi wasalami wraz ze wszystkimi posiadłościami. Pozostali oddadzą jedynie sporne ziemie de iure. Po porażce zachowasz zdobyty tytuł i dobrowolnych wasali."
 td_subjugation_finish_tt:0 "Zachowaj zdobyty tytuł i dobrowolnych wasali, po czym zakończ wyprawę. Otrzymasz jednostronne rozejmy z władcami, którzy stawiali opór w pierwszej wojnie i nadal pozostają poza twoim państwem; dłuższe istniejące rozejmy zostaną zachowane. Drugiej wojny nie będzie."
 td_subjugation_target_tt:0 "[THIS.Char.GetName] — potencjalny adresat żądania, posiadający ziemie de iure poza twoim państwem."

 td_subjugation_compatible_tt:0 "Oferta musi być nadal aktualna, a dominujący władca niezależny i w stanie pokoju. Każda odpowiedź i rozpoczynane wojny są sprawdzane względem bieżącej sytuacji wojskowej oraz wybranego trybu."
 td_subjugation_truce_name:0 "Wyprawa o dominację zakończyła się"
 title_domination.0002.subjugation_desc:0 "[td_dominant.GetTitledFirstName] ma już tytuł [td_target.GetName] i żąda mojego hołdu. Mogę stawić opór lub złożyć hołd, jeśli pozwala na to moja ranga. Mogę też poprosić o ochronę religijną, gdy umowa na to zezwala. Sojusz lub rozejm z tym władcą albo z jednym z wcześniejszych ochotników pozwala mi zachować neutralność i ziemie."
 td_subjugation_fight_tt:0 "Staw zbrojny opór. Po przegranej niezależny władca niższej rangi zostaje wasalem zwycięzcy i zachowuje swoje tytuły, ziemie i wasali, również poza granicami spornego tytułu. Jeżeli wasalizacja jest niemożliwa, warunki pokoju obejmują tylko sporne ziemie de iure. Jeżeli atak się nie powiedzie, dominujący władca zachowa zdobyty tytuł i dobrowolnych wasali. W tej wojnie nie płaci się reparacji."
 td_subjugation_join_tt:0 "Staniesz się wasalem i zachowasz ten status nawet po porażce seniora w tej fazie."
 title_domination.0002.unavailable:0 "Nie mogę wziąć udziału."
 td_subjugation_response_blocked_tt:0 "Obecna sytuacja wojskowa nie pozostawia dozwolonej odpowiedzi w drugiej fazie. Podporządkowanie zostaje odwołane; zabezpieczony tytuł i wszystkie dobrowolne przysięgi pozostają w mocy. Żadna inna wojna nie kończy się przymusowo."
 title_domination.0101.t:0 "Podporządkowanie nie mogło się rozpocząć"
 title_domination.0101.desc:0 "Sytuacja wojskowa zmieniła się i nie udało się rozpocząć podporządkowania. Zabezpieczony tytuł i wszyscy dobrowolnie poddani władcy pozostają pod władzą dominującego władcy. Kampania zakończyła się bez ponownych kosztów przygotowań."
 title_domination.0101.ok:0 "Rozumiem."
 rule_td_subjugation_war_mode:0 "Title Domination: wojny o podporządkowanie"
 setting_td_subjugation_coalition:0 "Wspólna koalicja"
 setting_td_subjugation_coalition_desc:0 "W drugiej fazie wszyscy stawiający opór bronią się razem w jednej wojnie ze wspólnym wynikiem. Pierwsza faza pozostaje bez zmian."
 setting_td_subjugation_individual:0 "Osobne wojny"
 setting_td_subjugation_individual_desc:0 "W drugiej fazie każdy stawiający opór toczy osobną wojnę z własnym wynikiem. Zakończenie jednej wojny nie kończy pozostałych. Pierwsza faza pozostaje bez zmian."
 td_subjugation_individual_cb:0 "Osobne podporządkowanie de iure"
 td_subjugation_individual_war:0 "Wojna o osobne podporządkowanie de iure — [DEFENDER.GetShortUINameNotMe]"
 td_subjugation_individual_victory:0 "Ziemie de iure podporządkowane"
 td_subjugation_individual_defeat:0 "Osobne podporządkowanie odparte"
 td_subjugation_mode_coalition_tt:0 "#bold Wspólna koalicja:#! wszyscy stawiający opór bronią się w jednej wojnie drugiej fazy ze wspólnym wynikiem."
 td_subjugation_mode_individual_tt:0 "#bold Osobne wojny:#! każdy stawiający opór toczy własną wojnę drugiej fazy. Zwycięstwo lub porażka rozstrzyga tylko wojnę z tym przeciwnikiem; pozostałe trwają dalej. Porażka zachowuje zabezpieczony tytuł i wszystkich dobrowolnych wasali, a rozejm otrzymuje tylko główny obrońca danej wojny."
