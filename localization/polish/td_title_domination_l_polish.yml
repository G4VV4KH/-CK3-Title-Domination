 td_fc_support_row_5_conditional_tt:0 "$td_fc_support_row_5_tt$ #warning Ochrona wiary.#!"
 td_fc_fighters_rest_tt:0 "Pozostali władcy: [SCOPE.ScriptValue('td_fc_fighters_rest_count_value')|0]; [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_rest_strength_value')|0]."
