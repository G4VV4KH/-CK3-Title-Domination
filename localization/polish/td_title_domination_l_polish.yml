l_polish:
 td_title_button:0 "Dominacja"
 td_title_button_tt:0 "Sprawdź władców de iure, zanim ogłosisz ten tytuł i rozpoczniesz wojnę o dominację. Podane złoto i prestiż zostaną pobrane przy rozpoczęciu.\n\nMusisz pozostawać w pokoju i posiadać wystarczającą ilość obu zasobów. Trwająca próba dominacji lub niewygasły okres oczekiwania również blokują tę akcję.\n\n"
 td_cooldown_available_tt:0 "Czas do kolejnej próby dominacji: [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'td_domination_cooldown' ))]"
 title_domination.0001.t:0 "Dominacja nad [td_target.GetName]"
 title_domination.0001.desc:0 "Tytuł [td_target.GetName] nie ma posiadacza. Mogę go ogłosić i zażądać uznania mojej władzy od władców jego ziem de iure. Mogą stawić opór, pozostać neutralni lub złożyć hołd, jeśli pozwala na to ich ranga.\n\nWyprawa kosztuje [gold_i] #V [SCOPE.ScriptValue('td_gold_cost_value')|2]#! oraz [prestige_i] #V [SCOPE.ScriptValue('td_prestige_cost_value')|2]#!. Cena zależy od rangi tytułu, jego ziem oraz ich odległości od mojego państwa.\n\nZwycięstwo zapewnia mi tytuł. Porażka go niszczy, uwalnia władców de iure, którzy do mnie dołączyli, i zobowiązuje mnie do wypłaty reparacji tym, którzy stawili opór."
 title_domination.0001.begin:0 "Rozpocząć ekspansję."
 title_domination.0001.cancel:0 "Zrezygnować z ekspansji."
 title_domination.0002.t:0 "Żądanie uznania dominacji"
 title_domination.0002.desc:0 "[td_dominant.GetTitledFirstName] ogłasza tytuł [td_target.GetName] i żąda uznania od jego władców de iure. Po otrzymaniu odpowiedzi rozpocznie się jedna wspólna wojna przeciwko tym, którzy wybiorą opór.\n\nMogę stawić opór, zachować neutralność lub złożyć hołd, jeśli pozwala na to moja ranga. Odmienna wiara może uprawniać mnie do prośby o ochronę religijną. Odpowiedź militarna jest niedostępna, gdy moje obecne wojny kolidują z dominującym władcą lub kimś, kto już wybrał stronę. Niezwiązane wojny nie uniemożliwiają odpowiedzi.\n\nWładcy odpowiadają kolejno, począwszy od najsilniejszej pozostałej armii. Negocjacje religijne kończą się przed zwróceniem się do następnego władcy. Odpowiedzi następują natychmiast tego samego dnia; w grze jednoosobowej zwykła pauza wydarzenia zatrzymuje czas podczas wyboru gracza."
 title_domination.0002.fight:0 "Będę walczyć z dominującym władcą."
 title_domination.0002.ignore:0 "To nie moja walka."
 title_domination.0002.join:0 "Złożę hołd i dołączę do wojny."
 title_domination.0002.religion:0 "Chrońcie moją wiarę, a złożę hołd."
 title_domination.0003.t:0 "Prośba o ochronę religijną"
 title_domination.0003.desc:0 "[td_requester.GetTitledFirstName], władca innej wiary, proponuje uznać moją władzę nad tytułem [td_target.GetName], zostać moim wasalem i dołączyć do wojny. W zamian kontrakt wasalny musi gwarantować ochronę religijną.\n\nJeśli odmówię, ponownie wybierze między oporem, neutralnością a podporządkowaniem bez tej ochrony."
 title_domination.0003.grant:0 "Ta wiara będzie chroniona."
 title_domination.0003.refuse:0 "Nie przyznam takiej ochrony."
 title_domination.0004.t:0 "Odmowa ochrony religijnej"
 title_domination.0004.desc:0 "[td_dominant.GetTitledFirstName] odrzuca moją prośbę o ochronę religijną. Muszę zdecydować, czy walczyć, zachować neutralność, czy złożyć hołd bez tej gwarancji."
 title_domination.0004.ok:0 "Muszę więc wybrać ponownie."
 title_domination.0010.t:0 "Los tytułu [td_target.GetName]"
 title_domination.0010.victory_desc:0 "Walka o dominację dobiegła końca. Moja władza nad tytułem [td_target.GetName] została umocniona i pozostaje on mój."
 title_domination.0010.defeat_desc:0 "Moja próba dominacji nad tytułem [td_target.GetName] zakończyła się porażką. Ogłoszony tytuł zostaje zniszczony, władcy de iure, którzy dołączyli do wyprawy, odzyskują niepodległość, a stawiającym opór należą się reparacje."
 title_domination.0010.ok:0 "Sprawa została rozstrzygnięta."
 td_domination_cb:0 "Dominacja nad tytułem"
 td_domination_war:0 "Wojna o dominację nad tytułem"
 td_domination_victory:0 "Dominacja umocniona"
 td_domination_defeat:0 "Dominacja odparta"
 td_preview_defenders_tt:0 "Władcy de iure wezwani w tej wyprawie:"
 td_start_tt:0 "Zapłać koszt i ogłoś tytuł. Władcy odpowiadają tego samego dnia, od najsilniejszego; wojna następuje po wszystkich odpowiedziach. Rozpoczęcie uruchamia dziesięcioletni okres oczekiwania: zwycięstwo, tytuł bez oporu lub techniczne anulowanie ze zwrotem kosztów go usuwa; porażka zachowuje pozostały czas."
 td_join_tt:0 "Zostajesz wasalem dominującego władcy i dołączasz do jego strony, gdy rozpoczyna się wspólna wojna. Jeśli przegra tę wyprawę, odzyskasz niepodległość. Wybór musi być zgodny z sytuacją wszystkich, którzy już opowiedzieli się po którejś stronie."
 td_religion_tt:0 "Poproś o ochronę religijną w kontrakcie wasalnym. Jeśli zostanie przyznana, zostaniesz wasalem i dołączysz do dominującego władcy. W razie odmowy wybierzesz ponownie bez tej opcji."
 td_neutral_tt:0 "Pozostajesz poza wojną i zachowujesz swoje ziemie oraz dotychczasowy status polityczny. Nie otrzymasz udziału w reparacjach."
 td_fight_tt:0 "Po nadejściu pozostałych odpowiedzi dołączasz do wspólnej wojny przeciwko dominującemu władcy. Jeśli wyprawa się nie powiedzie, otrzymasz część reparacji."
 td_victory_tt:0 "Dominujący władca zachowuje ogłoszony tytuł."
 td_defeat_tt:0 "Ogłoszony tytuł zostaje zniszczony. Władcy de iure, którzy dołączyli do dominującego władcy, odzyskują niepodległość, a reparacje są dzielone między stawiających opór."
 td_preview_ruler_tt:0 "[THIS.Char.GetName] — [THIS.Char.GetPrimaryTitle.GetName]"
 title_domination.0007.t:0 "Nie udało się zebrać koalicji"
 title_domination.0007.desc:0 "Sytuacja militarna zmieniła się po udzieleniu odpowiedzi lub zadeklarowani uczestnicy nie mogli wejść do jednej wspólnej wojny. Żaden przyjęty uczestnik nie zostanie pominięty bez ostrzeżenia. Próba dominacji nad tytułem [td_target.GetName] została anulowana, a jej pełny koszt w złocie i prestiżu zwrócony.\n\nTymczasowy tytuł zostaje rozwiązany, a władcy podporządkowani na potrzeby tej wyprawy — uwolnieni. Ich pozostałe wojny trwają bez zmian."
 title_domination.0007.ok:0 "Muszę ponownie rozważyć tę wyprawę."
 td_oath_current_war_desc:0 "\n\nJuż walczę z dominującym władcą w innej wojnie. Dopóki ten konflikt trwa, nie mogę uczestniczyć z nim w drugiej wspólnej wojnie ani złożyć mu hołdu. Neutralność pozostawia naszą obecną wojnę bez zmian."
 td_oath_current_war_tt:0 "Nie możesz złożyć hołdu, gdy jesteś już wrogiem dominującego władcy w innej wojnie. Ta decyzja nie zakończy istniejącego konfliktu."
 td_fight_military_available_tt:0 "Ta odpowiedź musi być nadal aktualna. Twoje wojny muszą pozwalać ci przeciwstawić się dominującemu władcy i wszystkim przyjętym ochotnikom u boku każdego władcy, który już wybrał opór."
 td_join_military_available_tt:0 "Ta odpowiedź musi być nadal aktualna. Twoje wojny muszą pozwalać ci dołączyć do dominującego władcy i wszystkich przyjętych ochotników przeciwko każdemu władcy, który już wybrał opór."
 td_religion_grant_available_tt:0 "Prośba musi być nadal aktualna i spełniać warunki ochrony religijnej. Wojny proszącego władcy muszą nadal pozwalać mu dołączyć do twojej strony we wspólnej wojnie."
 td_legacy_campaign_title:0 "Wcześniejsza wyprawa"
 td_legacy_campaign_desc:0 "Dawne zasady oczekiwania i opóźnionego wsparcia nie są już używane. Niedokończona próba na tych zasadach zostaje anulowana, koszty przygotowań zwrócone, tymczasowy tytuł rozwiązany, a podporządkowani władcy uwolnieni. Istniejące wojny pozostają bez zmian."
 td_legacy_campaign_close:0 "Rozumiem."
 td_oath_rejected_desc:0 "\n\nNie udało się ustanowić przysięgi. Mogę teraz stawić opór, jeśli ten wybór jest dostępny, albo zachować neutralność."
 td_fc_header_tt:0 "#T Prognoza według najbardziej prawdopodobnych odpowiedzi#!"
 td_fc_own_tt:0 "#high Twoje państwo:#! [soldier_i] [SCOPE.ScriptValue('td_fc_own_strength_value')|0] ([SCOPE.ScriptValue('td_fc_own_share_value')|%0] przewidywanych sił twojej strony)."
 td_fc_support_header_tt:0 "#P Przewidywane wsparcie:#! [SCOPE.ScriptValue('td_fc_support_count_value')|0] władców, [soldier_i] [SCOPE.ScriptValue('td_fc_support_strength_value')|0]."
 td_fc_fighters_header_tt:0 "#N Przewidywany opór:#! [SCOPE.ScriptValue('td_fc_fighters_count_value')|0] władców, [soldier_i] [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0]."
 td_fc_neutral_header_tt:0 "#high Przewidywana neutralność:#! [SCOPE.ScriptValue('td_fc_neutral_count_value')|0] władców, [soldier_i] [SCOPE.ScriptValue('td_fc_neutral_strength_value')|0]."
 td_fc_conditional_tt:0 "#warning Warunkowe wsparcie:#! [SCOPE.ScriptValue('td_fc_conditional_count_value')|0] władców / [soldier_i] [SCOPE.ScriptValue('td_fc_conditional_strength_value')|0] prawdopodobnie poprosi o ochronę religijną. Ten scenariusz zakłada, że jej udzielisz, a ich przysięga dojdzie do skutku."
 td_fc_ratio_tt:0 "#high Przewidywane siły:#! [soldier_i] [SCOPE.ScriptValue('td_fc_side_strength_value')|0] po twojej stronie przeciwko [SCOPE.ScriptValue('td_fc_fighters_strength_value')|0] stawiających opór ([SCOPE.ScriptValue('td_fc_ratio_value')|2]:1)."
 td_fc_no_fighters_tt:0 "Stosunek sił nie jest obliczany: przewidywany opór liczy [soldier_i] 0 żołnierzy."
 td_fc_caveat_tt:0 "#weak Stan w chwili podglądu: dla każdego władcy jedna odpowiedź o najwyższej wadze, nie wartość oczekiwana sił stron. Szanse wynikają z wag SI; gracze i wcześniejsze odpowiedzi mogą zmienić wynik. Obecne wojska nie obejmują zewnętrznych sojuszników ani przyszłego poboru i nie określają szansy zwycięstwa. Udziały wsparcia dotyczą całej twojej strony, pozostałe — własnej grupy.#!"
 td_diplomacy_begin_tt:0 "#warning Tylko rzeczywista wojna narusza umowy.#! Za każdego zaatakowanego sojusznika: zerwanie sojuszu, −250 prestiżu i −1 poziom sławy. Za każdy naruszony przez ciebie rozejm: −250 prestiżu, −1 poziom sławy i utrata legitymacji zależna od rangi. Ponadto przez trzy lata obowiązują modyfikatory opinii: −25 za atakowanie sojuszników i −50 za łamanie rozejmów, po jednym każdego typu. Straty zasobów sumują się za każdego przeciwnika; uwzględniane są atuty i specjalne zwolnienia. Obrońcy, neutralni i wyprawy bez wojny nie ponoszą kar."
 td_diplomacy_join_tt:0 "#warning Dołączasz do strony atakującej.#! Twoje sojusze i rozejmy wobec obrońców mogą powodować te same straty prestiżu, sławy i — przy rozejmach — legitymacji za każdego przeciwnika oraz modyfikatory opinii. Ochrona religijna nie zwalnia z kar; bez wojny nie ma kar."
 td_diplomacy_defend_tt:0 "Obrona przed dominującym władcą nie czyni cię sprawcą zerwania sojuszu ani rozejmu. Za naruszone umowy odpowiada strona atakująca."
 td_fc_support_rest_tt:0 "Pozostali władcy: [SCOPE.ScriptValue('td_fc_support_rest_count_value')|0]; [soldier_i] [SCOPE.ScriptValue('td_fc_support_rest_strength_value')|0]."
