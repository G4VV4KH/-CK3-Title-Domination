 td_fc_unavailable_tt:0 "Prognoza jest niedostępna w tym starszym podglądzie. Zamknij go i ponownie otwórz akcję tytułu, aby otrzymać aktualny obraz sytuacji."
 td_settlement_truce_tt:0 "Jednostronny [truce|E]: [attacker.GetShortUIName|U] → [defender.GetShortUIName], co najmniej #V [SCOPE.ScriptValue('standard_truce_duration_days')|0]#! dni. Dłuższy istniejący rozejm zostaje zachowany."
