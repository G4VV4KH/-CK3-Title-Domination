l_polish:
 rule_td_domination_territory:0 "Dominacja nad tytułami: dostępne tytuły"
 setting_td_territory_all:0 "Wszystkie tytuły"
 setting_td_territory_all_desc:0 "Możesz ogłosić dominację nad nieutworzonym tytułem w dowolnym miejscu na mapie."
 setting_td_territory_realm:0 "Hrabstwo w twoim państwie"
 setting_td_territory_realm_desc:0 "Co najmniej jedno hrabstwo należące de iure do wybranego tytułu musi leżeć w twoim państwie. Liczą się także hrabstwa twoich wasali."
 setting_td_territory_capital:0 "Tytuły obejmujące twoją stolicę"
 setting_td_territory_capital_desc:0 "Hrabstwo ze stolicą twojego państwa musi należeć de iure do wybranego tytułu."
 td_discover_domination_decision:0 "Możesz ogłosić dominację"
 td_discover_domination_desc:0 "Wybierz nieutworzony tytuł, na którego kampanię cię stać. W oknie tytułu możesz sprawdzić koszt przygotowań i warunki kampanii przed podjęciem decyzji."
 td_discover_domination_tooltip:0 "Zobacz tytuły dostępne do ogłoszenia dominacji."
 td_discover_domination_confirm:0 "Otwórz tytuł"
 rule_td_ai_frequency:0 "Title Domination: częstotliwość kampanii SI"
 setting_td_ai_off:0 "Wyłączone"
 setting_td_ai_off_desc:0 "Władcy sterowani przez SI mogą odpowiedzieć na żądanie uznania dominacji, ale nie rozpoczynają własnych kampanii."
 setting_td_ai_rare:0 "Rzadko"
 setting_td_ai_rare_desc:0 "Co roku istnieje niewielka szansa, że władca sterowany przez SI rozważy jeden z pobliskich tytułów. Wymaga znacznych rezerw i przytłaczającej przewagi militarnej."
 setting_td_ai_medium:0 "Umiarkowanie"
 setting_td_ai_medium_desc:0 "Władcy sterowani przez SI mogą co roku rozważać pobliskie tytuły. Zachowują rezerwy i dążą do uzyskania przewagi nad spodziewanymi przeciwnikami."
 setting_td_ai_frequent:0 "Często"
 setting_td_ai_frequent_desc:0 "Co kwartał władcy sterowani przez SI, którzy spełniają wymagania, mają 25% szans na rozważenie pobliskich tytułów. Mogą wydać wszystkie dostępne środki i rozpocząć kampanię mimo niewielkiej przewagi przeciwników."
